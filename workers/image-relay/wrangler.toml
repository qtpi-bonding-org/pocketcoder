name = "pocketcoder-image-relay"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Required secrets (set with scripts/set-secrets.sh):
# REVENUECAT_SECRET_KEY, REVENUECAT_PROJECT_ID

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "pocketcoder-images"

[[d1_databases]]
binding = "DB"
database_name = "pocketcoder-image-relay"
database_id = "<filled in after wrangler d1 create>"
