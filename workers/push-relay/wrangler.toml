name = "pocketcoder-push-relay"
main = "src/index.js"
compatibility_date = "2024-12-01"

[vars]
DAILY_PUSH_LIMIT = "1000"

# Secrets (set via `wrangler secret put`):
# REVENUECAT_SECRET_KEY — RevenueCat V2 secret API key
# REVENUECAT_PROJECT_ID — RevenueCat project id (e.g. proj1ab2c3d4), required by the V2 API's URL path
# FCM_PROJECT_ID        — Firebase project id (kept out of source, not just credentials)
# FCM_CLIENT_EMAIL      — from Firebase service account JSON
# FCM_PRIVATE_KEY       — base64 of service account private_key PEM
# SUPABASE_URL          — e.g. https://xxx.supabase.co
# SUPABASE_SERVICE_KEY  — Supabase service_role key
