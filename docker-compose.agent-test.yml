# Opt-in acceptance runner for the active c1 PocketBase + c2 Goose runtime,
# plus c3 (the Docker MCP Gateway) for MCP-governance coverage. It
# intentionally does not depend on Interface, OpenCode, or the sandbox.
services:
  # Test-only fixed Goose fixture for low-level ACP/config acceptance tests.
  # Production has no singleton Goose service; it provisions Goose lazily from
  # the goose-harness-image catalog entry like every other harness.
  goose:
    image: pocketcoder-goose:1.43.0
    build:
      context: server/goose
      dockerfile: Dockerfile
    container_name: pocketcoder-goose
    profiles: ["agent-test"]
    environment:
      # All of GOOSE_PROVIDER/GOOSE_MODEL/ANTHROPIC_HOST/ANTHROPIC_API_KEY/
      # OPENROUTER_API_KEY are bare (host pass-through) on purpose, not
      # `KEY: ${KEY:-default}` map interpolation. The map form always sets
      # the var in the container -- even to an empty string when the host
      # doesn't have one -- which caused two real problems this fixture
      # doesn't need:
      #   1. goose's Config::get_secret() checks the process environment
      #      BEFORE its secrets store, treating a present-but-empty var as
      #      an authoritative (empty) credential. That silently shadowed
      #      any credential registered live via
      #      _goose/unstable/providers/config/save, producing a real
      #      outbound 401 ("Missing Authentication header") even though the
      #      registered credential was valid and correctly saved.
      #   2. A hardcoded GOOSE_PROVIDER=anthropic default (routed through a
      #      legacy ANTHROPIC_HOST minimax-proxy override) with no matching
      #      credential gave the container a half-configured default
      #      provider that raced with goose's own session-activation code,
      #      producing flaky "Provider not set" errors unrelated to this
      #      fixture's actual test intent.
      # Bare pass-through omits every one of these entirely when unset on
      # the host, matching how a real production container never gets a
      # provider baked in unless one was actually resolved for the launch
      # (hooks.renderEnv) -- no default provider, no empty placeholder.
      GOOSE_SERVER__SECRET_KEY: ${GOOSE_SERVER__SECRET_KEY:?set the Goose ACP secret}
      OLLAMA_HOST: http://ollama:11434
      GOOSE_DISABLE_KEYRING: "1"
      GOOSE_PATH_ROOT: /workspace/.pocketcoder_auth
      GOOSE_TELEMETRY_ENABLED: "false"
      GOOSE_PROVIDER:
      GOOSE_MODEL:
      ANTHROPIC_HOST:
      ANTHROPIC_API_KEY:
      OPENROUTER_API_KEY:
    volumes:
      - agent_test_goose_state:/workspace/.pocketcoder_auth
      - agent_test_goose_config:/workspace/.pocketcoder_auth/config
      - workspace:/workspace
    working_dir: /workspace
    networks:
      - pocketcoder-agent
      - pocketcoder-harness-egress
      - pocketcoder-mcp-gateway
      - pocketcoder-memory
      - pocketcoder-model
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pocketbase:
    volumes:
      - agent_test_goose_config:/goose-config
    environment:
      - API_TEST_EMAIL=${API_TEST_EMAIL:-}
      - API_TEST_PASSWORD=${API_TEST_PASSWORD:-}
      # The dynamic Goose harness is provisioned by PocketBase, so the fixed
      # Goose test container's provider environment does not reach it. Keep
      # this override scoped to the opt-in acceptance stack.
      - POCKETCODER_AGENT_TEST_PROVIDER=${GOOSE_PROVIDER:-anthropic}
      - POCKETCODER_AGENT_TEST_MODEL=${GOOSE_MODEL:-MiniMax-M2.5}
      - POCKETCODER_AGENT_TEST_API_KEY=${OPENROUTER_API_KEY:-}

  agent-c1-test:
    build:
      context: .
      dockerfile: server/test/Dockerfile
    profiles: ["agent-test"]
    depends_on:
      goose:
        condition: service_healthy
      pocketbase:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
    volumes:
      - ./tests:/tests:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PB_URL: http://pocketbase:8090
      PB_AUTH_COLLECTION: ${PB_AUTH_COLLECTION:-users}
      AGENT_TEST_EMAIL: ${AGENT_TEST_EMAIL:?set an ordinary PocketBase test-user email}
      AGENT_TEST_PASSWORD: ${AGENT_TEST_PASSWORD:?set that test user's password}
      AGENT_TEST_TIMEOUT_SECONDS: ${AGENT_TEST_TIMEOUT_SECONDS:-120}
      MCP_GATEWAY_AUTH_TOKEN: ${MCP_GATEWAY_AUTH_TOKEN:?set the gateway auth token}
      GOOSE_CONTAINER: ${GOOSE_CONTAINER:-pocketcoder-goose}
      POCKETBASE_CONTAINER: ${POCKETBASE_CONTAINER:-pocketcoder-pocketbase}
      MCP_GATEWAY_CONTAINER: ${MCP_GATEWAY_CONTAINER:-pocketcoder-mcp-gateway}
    networks:
      # Reaches PocketBase's API only; the private pocketcoder-agent ACP net
      # stays a two-node c1<->c2 channel.
      - pocketcoder-pocketbase-sdk
      # Direct MCP protocol assertions exercise the gateway without going
      # through Goose's model adapter.
      - pocketcoder-mcp-gateway

  api-flow-test:
    build:
      context: .
      dockerfile: server/test/Dockerfile
    profiles: ["api-test"]
    depends_on:
      pocketbase:
        condition: service_healthy
    command: ["--tap", "/tests/compose/api/core.bats"]
    volumes:
      - ./tests:/tests:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PB_URL: http://pocketbase:8090
      PB_AUTH_COLLECTION: ${PB_AUTH_COLLECTION:-users}
      API_TEST_EMAIL: ${API_TEST_EMAIL:?set an ordinary PocketBase API-flow test-user email}
      API_TEST_PASSWORD: ${API_TEST_PASSWORD:?set that API-flow test user's password}
      AGENT_EMAIL: ${AGENT_EMAIL:-}
      AGENT_PASSWORD: ${AGENT_PASSWORD:-}
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL:-}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD:-}
      POCKETBASE_CONTAINER: ${POCKETBASE_CONTAINER:-pocketcoder-pocketbase}
    networks:
      - pocketcoder-pocketbase-sdk

volumes:
  agent_test_goose_state:
  agent_test_goose_config:
