[package]
name = "pocket-memory"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
async-trait = "=0.1.89"
axum = "=0.8.9"
base64 = "=0.22.1"
llama-cpp-2 = { version = "=0.1.154", default-features = false }
rmcp = { version = "=3.1.2", features = ["transport-streamable-http-server"] }
schemars = "=1.2.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
sqlite-vec = "=0.1.9"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rusqlite = { version = "=0.7.0", features = ["bundled", "modern_sqlite"] }
tokio-util = "=0.7.18"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.22", features = ["env-filter"] }
uuid = { version = "=1.24.0", features = ["serde", "v7"] }

[dev-dependencies]
rmcp = { version = "=3.1.2", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
doc_markdown = "allow"
