openapi: 3.0.3
info:
  title: PocketCoder operation API
  version: 1.0.0
  description: Spec-first contract for PocketCoder custom operations. PocketBase collection APIs are out of scope.
servers:
  - url: /
paths:
  /api/pocketcoder/v1/chats/{chatId}/session/prompt:
    post:
      operationId: promptChat
      tags: [agent]
      security: [{pocketbaseToken: []}]
      parameters: [{ $ref: '#/components/parameters/ChatId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PromptRequest' } } } }
      responses: { '202': { description: Run accepted, content: { application/json: { schema: { $ref: '#/components/schemas/AcceptedResponse' } } } }, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '503': {$ref: '#/components/responses/Unavailable'} }
  /api/pocketcoder/v1/chats/{chatId}/stream:
    get:
      operationId: streamChatEvents
      tags: [agent]
      x-pocketcoder-transport: sse
      security: [{pocketbaseToken: []}]
      parameters: [{ $ref: '#/components/parameters/ChatId' }, { $ref: '#/components/parameters/Cursor' }]
      responses: { '200': { description: Incremental AG-UI events, content: { text/event-stream: { schema: { $ref: '#/components/schemas/AgentEvent' } } } }, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'} }
  /api/pocketcoder/v1/chats/{chatId}/session/cancel:
    post:
      operationId: cancelChatSession
      tags: [agent]
      security: [{pocketbaseToken: []}]
      parameters: [{ $ref: '#/components/parameters/ChatId' }]
      responses: { '202': {description: Cancellation accepted}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'} }
  /api/pocketcoder/v1/chats/{chatId}/session/set-mode:
    post:
      operationId: setChatMode
      tags: [agent]
      security: [{pocketbaseToken: []}]
      parameters: [{ $ref: '#/components/parameters/ChatId' }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModeRequest'}}}}
      responses: {'202': {description: Operation accepted}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '502': {$ref: '#/components/responses/BadGateway'}, '503': {$ref: '#/components/responses/Unavailable'} }
  /api/pocketcoder/v1/chats/{chatId}/session/set-config-option:
    post:
      operationId: setChatConfigOption
      tags: [agent]
      security: [{pocketbaseToken: []}]
      parameters: [{ $ref: '#/components/parameters/ChatId' }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConfigOptionRequest'}}}}
      responses: {'202': {description: Operation accepted}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '502': {$ref: '#/components/responses/BadGateway'}, '503': {$ref: '#/components/responses/Unavailable'} }
  /api/pocketcoder/v1/chats/{chatId}/session/request-permission/{id}:
    post:
      operationId: respondToPermission
      tags: [agent]
      security: [{pocketbaseToken: []}]
      parameters: [{ $ref: '#/components/parameters/ChatId' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DecisionRequest'}}}}
      responses: {'202': {description: Operation accepted}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '502': {$ref: '#/components/responses/BadGateway'}, '503': {$ref: '#/components/responses/Unavailable'} }
  /api/pocketcoder/v1/chats/{chatId}/session/elicitation/{id}:
    post:
      operationId: respondToElicitation
      tags: [agent]
      security: [{pocketbaseToken: []}]
      parameters: [{ $ref: '#/components/parameters/ChatId' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DecisionRequest'}}}}
      responses: {'202': {description: Operation accepted}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '502': {$ref: '#/components/responses/BadGateway'}, '503': {$ref: '#/components/responses/Unavailable'} }
  /api/pocketcoder/v1/harness-auth/status:
    post:
      operationId: getHarnessAuthStatus
      tags: [harness-auth]
      security: [{pocketbaseToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessRequest'}}}}
      responses: {'200': {description: Harness authentication status, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessAuthStatus'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} }
  /api/pocketcoder/v1/harness-auth/start:
    post:
      operationId: startHarnessAuth
      tags: [harness-auth]
      security: [{pocketbaseToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessRequest'}}}}
      responses: {'200': {description: Harness authentication status, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessAuthStatus'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} }
  /api/pocketcoder/v1/harness-auth/poll:
    post:
      operationId: pollHarnessAuth
      tags: [harness-auth]
      security: [{pocketbaseToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessRequest'}}}}
      responses: {'200': {description: Harness authentication status, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessAuthStatus'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} }
  /api/pocketcoder/v1/harness-auth/submit:
    post:
      operationId: submitHarnessAuth
      tags: [harness-auth]
      security: [{pocketbaseToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessRequest'}}}}
      responses: {'200': {description: Harness authentication status, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessAuthStatus'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} }
  /api/pocketcoder/v1/harness-auth/cancel:
    post:
      operationId: cancelHarnessAuth
      tags: [harness-auth]
      security: [{pocketbaseToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessRequest'}}}}
      responses: {'200': {description: Harness authentication status, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessAuthStatus'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} }
  /api/pocketcoder/v1/harness-auth/disconnect:
    post:
      operationId: disconnectHarnessAuth
      tags: [harness-auth]
      security: [{pocketbaseToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessRequest'}}}}
      responses: {'200': {description: Harness authentication status, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessAuthStatus'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} }
  /api/pocketcoder/v1/schedules/{scheduleId}/run:
    post:
      operationId: runScheduleNow
      tags: [schedules]
      security: [{pocketbaseToken: []}]
      parameters: [{name: scheduleId, in: path, required: true, schema: {type: string, minLength: 1}}]
      responses: {'202': {description: Schedule run accepted, content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleRunAcceptedResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'} }
  /api/pocketcoder/v1/files:
    get:
      operationId: getWorkspaceFile
      tags: [files]
      x-pocketcoder-transport: binary
      security: [{pocketbaseToken: []}]
      parameters: [{ $ref: '#/components/parameters/FilePath' }]
      responses: {'200': {description: Raw file bytes, content: {application/octet-stream: {schema: {type: string, format: binary}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'} }
  /api/pocketcoder/v1/files-tree:
    get:
      operationId: listWorkspaceFileTree
      tags: [files]
      security: [{pocketbaseToken: []}]
      parameters: [{ $ref: '#/components/parameters/DirectoryPath' }]
      responses: {'200': {description: Full recursive directory tree, content: {application/json: {schema: {$ref: '#/components/schemas/FileTreeResponse'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'} }
  /api/pocketcoder/v1/ollama/models:
    get:
      operationId: listOllamaModels
      tags: [ollama]
      x-pocketcoder-roles: [admin]
      security: [{pocketbaseToken: []}]
      responses: {'200': {description: Ollama model inventory, content: {application/json: {schema: {$ref: '#/components/schemas/OllamaModelsResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} }
  /api/pocketcoder/v1/ollama/pull:
    post:
      operationId: pullOllamaModel
      tags: [ollama]
      x-pocketcoder-roles: [admin]
      x-pocketcoder-transport: ndjson
      security: [{pocketbaseToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelRequest'}}}}
      responses: {'200': {description: Incremental pull progress, content: {application/x-ndjson: {schema: {$ref: '#/components/schemas/OllamaProgress'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '502': {$ref: '#/components/responses/BadGateway'}, '503': {$ref: '#/components/responses/Unavailable'} }
  /api/pocketcoder/v1/mcp/request:
    post:
      operationId: executeMcpRequest
      tags: [mcp]
      x-pocketcoder-roles: [agent, admin]
      security: [{pocketbaseToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/McpRequest'}}}}
      responses: {'200': {description: MCP request result, content: {application/json: {schema: {$ref: '#/components/schemas/ExecuteMcpRequestResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/Unprocessable'}, '500': {$ref: '#/components/responses/InternalError'} }
  /api/pocketcoder/v1/mcp/oauth/store:
    post:
      operationId: storeMcpOAuthToken
      tags: [mcp]
      security: [{pocketbaseToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/McpOAuthRequest'}}}}
      responses: {'200': {description: OAuth token stored, content: {application/json: {schema: {$ref: '#/components/schemas/StoreMcpOAuthTokenResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} }
  /api/pocketcoder/v1/compatibility:
    get:
      operationId: getReleaseCompatibility
      tags: [release]
      security: []
      responses: {'200': {description: Release compatibility, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseCompatibilityResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} }
  /api/pocketcoder/v1/release/status:
    get:
      operationId: getReleaseStatus
      tags: [release]
      security: [{pocketbaseToken: []}]
      responses: {'200': {description: Release status, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseStatusResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} }
  /api/pocketcoder/v1/logs/{containerName}:
    get:
      operationId: streamContainerLogs
      tags: [logs]
      x-pocketcoder-roles: [admin]
      x-pocketcoder-transport: sse
      security: [{pocketbaseToken: []}]
      parameters: [{ $ref: '#/components/parameters/ContainerName' }]
      responses: {'200': {description: Incremental container log events, content: {text/event-stream: {schema: {$ref: '#/components/schemas/LogEvent'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'} }
  /api/pocketcoder/v1/logs/instance/{id}:
    get:
      operationId: getHarnessInstanceLogs
      tags: [logs]
      x-pocketcoder-roles: [admin]
      security: [{pocketbaseToken: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, minLength: 1}}]
      responses: {'200': {description: Persisted container log excerpt, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessInstanceLogResponse'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'} }
  /api/pocketcoder/v1/containers:
    get:
      operationId: listContainers
      tags: [logs]
      x-pocketcoder-roles: [admin]
      security: [{pocketbaseToken: []}]
      responses: {'200': {description: This deployment's containers, content: {application/json: {schema: {$ref: '#/components/schemas/ContainerListResponse'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'} }
  /api/pocketcoder/v1/proxy/observability/{path}:
    get:
      operationId: proxyObservability
      tags: [observability]
      x-pocketcoder-transport: opaque-proxy
      x-pocketcoder-router-path: /api/pocketcoder/v1/proxy/observability/{path...}
      description: Authenticated users may access exactly `memory.sql`, the read-only memory dashboard. Every other SQLPage sub-path under this wildcard is restricted to administrators.
      security: [{pocketbaseToken: []}]
      parameters: [{name: path, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Opaque SQLPage response, content: {'*/*': {}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'} }
  /api/pocketcoder/v1/push:
    post:
      operationId: sendPushNotification
      tags: [push]
      x-pocketcoder-roles: [agent, admin]
      security: [{pocketbaseToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PushRequest'}}}}
      responses: {'204': {description: Operation completed}, '200': {description: Push notification sent, content: {application/json: {schema: {$ref: '#/components/schemas/OkResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'} }
  /api/pocketcoder/v1/live-activities/{id}/end:
    post:
      operationId: endLiveActivity
      tags: [live-activities]
      security: [{pocketbaseToken: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses: {'200': {description: Live activity ended, content: {application/json: {schema: {$ref: '#/components/schemas/OkResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {description: Activity is not active}}
  /api/pocketcoder/v1/live-activities/{id}/token:
    post:
      operationId: setLiveActivityToken
      tags: [live-activities]
      security: [{pocketbaseToken: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SetLiveActivityTokenRequest'}}}}
      responses: {'200': {description: Token updated, content: {application/json: {schema: {$ref: '#/components/schemas/OkResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {description: Activity is not active}}
components:
  securitySchemes:
    pocketbaseToken: {type: apiKey, in: header, name: Authorization, description: Raw PocketBase token; do not prefix with Bearer.}
  parameters:
    ChatId: {name: chatId, in: path, required: true, schema: {type: string, minLength: 1}}
    RequestId: {name: id, in: path, required: true, schema: {type: string, minLength: 1}}
    Cursor: {name: cursor, in: query, required: false, schema: {type: integer, minimum: 0}}
    FilePath: {name: path, in: query, required: true, schema: {type: string, minLength: 1}}
    DirectoryPath: {name: path, in: query, required: false, schema: {type: string, default: ''}}
    ContainerName: {name: containerName, in: path, required: true, schema: {type: string, minLength: 1}}
  responses:
    BadRequest: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unauthorized: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    InternalError: {description: Internal error, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unavailable: {description: Service unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    BadGateway: {description: Upstream service unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unprocessable: {description: Request could not be processed, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    ErrorResponse: {type: object, required: [status, message, data], additionalProperties: false, properties: {status: {type: integer}, message: {type: string}, data: {type: object, additionalProperties: true}}}
    OkResponse: {type: object, required: [ok], additionalProperties: false, properties: {ok: {type: boolean}}}
    StoreMcpOAuthTokenResponse: {type: object, required: [stored], additionalProperties: false, properties: {stored: {type: boolean}}}
    ExecuteMcpRequestResponse: {type: object, required: [id, status], additionalProperties: false, properties: {id: {type: string}, status: {type: string}, synced: {type: boolean}}}
    AcceptedResponse: {type: object, required: [runId], additionalProperties: false, properties: {runId: {type: string, minLength: 1}}}
    ScheduleRunAcceptedResponse: {type: object, required: [status], additionalProperties: false, properties: {status: {type: string, enum: [started]}}}
    PromptRequest: {type: object, required: [prompt], additionalProperties: false, properties: {prompt: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ContentBlock'}}, messageId: {type: string, format: uuid, description: 'Client-generated unique identifier for this user message, echoed back into the AG-UI event stream so it survives reconnect/cache-replay. Optional for backward compatibility with older clients.'}}}
    ContentBlock: {type: object, required: [type], additionalProperties: true, properties: {type: {type: string, minLength: 1}, text: {type: string}}}
    ModeRequest: {type: object, required: [modeId], additionalProperties: false, properties: {modeId: {type: string, minLength: 1}}}
    SetLiveActivityTokenRequest: {type: object, required: [activity_push_token], additionalProperties: false, properties: {activity_push_token: {type: string, minLength: 1}}}
    ConfigOptionRequest: {type: object, required: [configId, value], additionalProperties: false, properties: {configId: {type: string, minLength: 1}, value: {type: string}}}
    DecisionRequest: {type: object, additionalProperties: true}
    HarnessRequest: {type: object, required: [harness, provider], additionalProperties: false, properties: {harness: {type: string, minLength: 1}, provider: {type: string, minLength: 1, description: PocketBase providers record id}, accountId: {type: string}, accountName: {type: string}, visibility: {type: string}, mode: {type: string, enum: [oauth, none]}, attemptId: {type: string}, code: {type: string}}}
    HarnessAuthStatus: {type: object, required: [harness, provider, mode, status], additionalProperties: false, properties: {harness: {type: string}, provider: {type: string}, accountId: {type: string}, accountName: {type: string}, visibility: {type: string}, mode: {type: string, enum: [oauth, none]}, status: {type: string}, lastError: {type: string}, attempt: {$ref: '#/components/schemas/HarnessAuthAttempt'}, challenge: {$ref: '#/components/schemas/HarnessAuthChallenge'}}}
    HarnessAuthAttempt: {type: object, required: [id, status], additionalProperties: false, properties: {id: {type: string}, status: {type: string}, lastError: {type: string}}}
    HarnessAuthChallenge: {type: object, required: [type], additionalProperties: false, properties: {type: {type: string}, text: {type: string, deprecated: true}, target: {type: string, deprecated: true}, details: {type: string, deprecated: true}, kind: {type: string, enum: [device_code, browser_code]}, verificationUri: {type: string, format: uri}, userCode: {type: string}, codeDestination: {type: string, enum: [browser, app, none]}, expiresAt: {type: string, format: date-time}, pollIntervalSeconds: {type: integer, minimum: 1}}}
    ModelRequest: {type: object, required: [model], additionalProperties: false, properties: {model: {type: string, minLength: 1}}}
    McpRequest: {type: object, additionalProperties: true}
    McpOAuthRequest: {type: object, required: [server_name, access_token], additionalProperties: false, properties: {server_name: {type: string, minLength: 1}, access_token: {type: string, minLength: 1}, refresh_token: {type: string}}}
    PushRequest: {type: object, required: [user_id, type], additionalProperties: false, properties: {user_id: {type: string, minLength: 1}, title: {type: string}, message: {type: string}, type: {type: string, minLength: 1}, chat: {type: string}}}
    FileTreeResponse: {type: object, required: [path, entries], additionalProperties: false, properties: {path: {type: string}, entries: {type: array, items: {$ref: '#/components/schemas/FileTreeEntry'}}}}
    FileTreeEntry: {type: object, required: [name, isDir], additionalProperties: false, properties: {name: {type: string}, isDir: {type: boolean}, size: {type: integer, format: int64}, modTime: {type: string}, children: {type: array, items: {$ref: '#/components/schemas/FileTreeEntry'}}}}
    ContainerListResponse: {type: object, required: [containers], additionalProperties: false, properties: {containers: {type: array, items: {$ref: '#/components/schemas/ContainerSummary'}}}}
    ContainerSummary: {type: object, required: [name, state, status], additionalProperties: false, properties: {name: {type: string}, state: {type: string}, status: {type: string}}}
    OllamaModelsResponse: {type: object, required: [models, enabled], additionalProperties: false, properties: {models: {type: array, items: {type: object, additionalProperties: true}}, enabled: {type: boolean}}}
    ReleaseCompatibilityResponse: {type: object, required: [schemaVersion, dataVersion, compatibility], additionalProperties: false, properties: {schemaVersion: {type: integer}, dataVersion: {type: integer}, compatibility: {type: object, additionalProperties: true}}}
    ReleaseStatusResponse: {type: object, required: [schemaVersion, current, metadataStatus], additionalProperties: false, properties: {schemaVersion: {type: integer}, current: {type: object, additionalProperties: false, properties: {releaseDigest: {type: string}, sourceCommit: {type: string}, serverVersion: {type: string}, dataVersion: {type: integer}, deploymentContractVersion: {type: integer}, compatibility: {type: object, additionalProperties: true}, selectedHarnesses: {type: array, items: {type: string}}}}, metadataStatus: {type: object, additionalProperties: true}}}
    OllamaProgress: {type: object, additionalProperties: true}
    AgentEvent: {type: object, additionalProperties: true}
    LogEvent: {type: object, additionalProperties: true}
    HarnessInstanceLogResponse:
      type: object
      additionalProperties: false
      required: [lines, truncated]
      properties:
        lines: {type: array, items: {type: string}}
        truncated: {type: boolean}
