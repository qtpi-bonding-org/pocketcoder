name: pocketcoder_flutter
resolution: workspace
description: "Core logic and UI for the PocketCoder Flutter application."
publish_to: 'none'
version: 1.0.0+1
license: AGPL-3.0-or-later

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.18.0
  meta: ^1.0.0
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Architecture & State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4
  injectable: ^2.3.2

  # Custom Libraries
  cubit_ui_flow:
    git: 
      url: https://github.com/qtpi-bonding-org/flutter_cubit_ui_flow.git
      ref: 78ca8da8b52bd750c96443bcefe3ed1edcda5a52
  flutter_error_privserver:
    git:
      url: https://github.com/qtpi-bonding-org/flutter_error_privserver.git
      ref: be38ae65c5889729b3a5a656fd04b23411b17806
  flutter_color_palette:
    git: https://github.com/qtpi-bonding-org/flutter_color_palette.git
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.11.0
  l10n_key_resolver:
    git:
      url: https://github.com/qtpi-bonding-org/dart_l10n_key_resolver.git
      ref: 52e2dbca293de29f140a3be76ec95a24d07ee50f

  # Navigation
  go_router: ^14.0.0

  # Code Generation Support
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Utilities
  uuid: ^4.0.0
  flutter_secure_storage: ^10.0.0
  http: ^1.2.0
  dio: ^5.7.0
  built_collection: '>=5.1.1 <6.0.0'
  built_value: '>=8.4.0 <9.0.0'
  intl: ^0.20.2
  flutter_web_auth_2: ^5.0.3
  crypto: ^3.0.3
  pocketbase_drift: ^0.3.13
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.5.41
  path_provider: ^2.1.5
  path: ^1.9.1
  pocketbase: ^0.23.2
  dartssh2: ^2.22.5
  cryptography: ^2.7.0
  openssh_ed25519: ^1.1.0
  connectivity_plus: ^7.0.0
  connectivity_plus_platform_interface: ^2.0.1
  device_info_plus: ^11.3.0
  unifiedpush: ^6.2.0
  url_launcher: ^6.2.0
  webview_flutter: ^4.10.0
  ag_ui: 0.3.0
  acp_dart: 0.4.0
  pocketcoder_api:
    path: ../pocketcoder_api
  drift_flutter: 0.2.8
  flutter_chat_core: ^2.9.0
  flutter_chat_ui: ^2.11.1
  flyer_chat_text_stream_message: ^2.3.0
  ag_ui_widgets_flutter:
    git:
      url: https://github.com/qtpi-bonding-org/ag_ui_widgets_flutter.git
      ref: 21c2a311762aba68fd78960f4df2e4567bfb6cb0
  flutter_aeroform:
    git:
      url: git@github-qtpi-bonding-org-flutter_aeroform:qtpi-bonding-org/flutter_aeroform.git
      ref: 51959021cb4775a0ba251d0be231e2b00eab51d2

dependency_overrides:
  # Keep the UnifiedPush crypto dependency on the portable hosted 0.6.0
  # release.  Newer releases use a native build hook and the former Git
  # override made otherwise offline-capable analysis depend on Codeberg.
  webcrypto: 0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  webview_flutter_platform_interface: ^2.10.0

  # Code Generation
  build_runner: ^2.4.7
  freezed: ^3.0.0
  json_serializable: ^6.7.1
  injectable_generator: ^2.4.1
  widgetbook_generator: ^3.11.0
  mocktail: ^1.0.0
  drift_dev: ^2.31.0


flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/pb_schema.json
    - assets/boot_log.txt
    - assets/deployment/Caddyfile.template
    - assets/deployment/standard_linux_bootstrap.sh

  fonts:
    - family: Share Tech Mono
      fonts:
        - asset: assets/Share_Tech_Mono/ShareTechMono-Regular.ttf
    - family: Noto Sans Mono
      fonts:
        - asset: assets/Noto_Sans_Mono/static/NotoSansMono-Regular.ttf
        - asset: assets/Noto_Sans_Mono/static/NotoSansMono-Medium.ttf
          weight: 500
        - asset: assets/Noto_Sans_Mono/static/NotoSansMono-Bold.ttf
          weight: 700
