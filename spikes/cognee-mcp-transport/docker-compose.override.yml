# Disposable spike compose override — NOT part of the tracked docker-compose.yml.
# Confirms cognee-mcp is reachable over genuine MCP Streamable HTTP from a
# second container on a shared bridge network, mirroring the methodology in
# spikes/goose-mcp-gateway-attach/README.md.
#
# Usage:
#   cd spikes/cognee-mcp-transport
#   docker compose -f docker-compose.override.yml up -d
#   docker compose -f docker-compose.override.yml logs -f cognee-spike
#   docker run --rm --network cognee-mcp-transport_cognee-spike-net curlimages/curl:latest \
#     curl -sv -X POST http://cognee-spike:8000/mcp \
#     -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
#     -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"spike","version":"0.1"}}}'
#   docker compose -f docker-compose.override.yml down -v

services:
  cognee-spike:
    image: cognee/cognee-mcp:main
    environment:
      # cognee-mcp's entrypoint.sh reads TRANSPORT_MODE / HTTP_PORT itself and
      # appends the matching --transport/--host/--port flags LAST, after any
      # CLI args — so passing --transport as a `command:` arg is silently
      # overridden back to the image's stdio default. The env vars are the
      # only way to actually select http mode.
      - TRANSPORT_MODE=http
      - HTTP_PORT=8000
      # DNS-rebinding protection (mcp.server.transport_security in the
      # upstream `mcp` package) rejects any Host header not on this list with
      # HTTP 421 "Invalid Host header" — cognee-mcp's own src/server.py reads
      # this comma-separated env var to extend the allowlist beyond localhost.
      - MCP_ALLOWED_HOSTS=cognee-spike:8000
      # Not required for the container to boot or to answer MCP `initialize`
      # (verified by a second run with no LLM/embedding vars set at all —
      # boots fine, auth/db-migration all succeed). Only exercised lazily by
      # actual remember/recall calls, out of scope for this transport spike.
      - LLM_API_KEY=sk-test-placeholder
      - EMBEDDING_PROVIDER=fastembed
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
    networks:
      - cognee-spike-net

networks:
  cognee-spike-net:
    driver: bridge
