name: Release Contract

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'server/pocketbase/internal/api/release_status*'
      - 'server/pocketbase/internal/releaseartifact/**'
      - 'workers/image-relay/**'
      - 'client/packages/pocketcoder_flutter/**'
      - 'client/pubspec.lock'
      - '.github/workflows/release-contract.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-and-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: deploy/release-manager/go.mod

      - name: Install pinned schema validator
        run: python3 -m pip install -r deploy/release/requirements.txt

      - name: Verify generated schemas
        run: |
          deploy/release/generate-release-schemas.sh
          git diff --exit-code -- 'deploy/release/*.schema.json'

      - name: Test attested release contract
        run: |
          deploy/release/tests/release-schema-test.sh
          deploy/release/tests/release-contract-test.sh

      - name: Test native OS release manager
        working-directory: deploy/release-manager
        run: go test ./...

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/pocketbase/go.mod

      - name: Test Docker and PocketBase release migration
        run: deploy/release-manager/tests/run-docker-integration.sh

      - name: Test PocketBase release APIs and lazy loader
        working-directory: server/pocketbase
        run: go test ./internal/api ./internal/releaseartifact

  flutter-core:
    # Flutter's SDK setup is reliable on the standard GitHub runner; the
    # Blacksmith image repeatedly failed before emitting analyzer diagnostics.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: Resolve Flutter dependencies
        working-directory: client/packages/pocketcoder_flutter
        run: flutter pub get

      - name: Analyze Flutter Core
        working-directory: client/packages/pocketcoder_flutter
        run: flutter analyze --no-pub

      - name: Test verified release and status flows
        working-directory: client/packages/pocketcoder_flutter
        run: |
          flutter test --no-pub \
            test/infrastructure/release/release_content_service_test.dart \
            test/domain/release/server_release_status_test.dart \
            test/application/release_status/release_status_cubit_test.dart \
            test/presentation/core/widgets/release_status_banner_test.dart
