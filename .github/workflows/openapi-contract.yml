name: Generated contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/openapi/**'
      - 'server/pocketbase/pb_migrations/schema.json'
      - 'server/pocketbase/internal/openapi/**'
      - 'server/pocketbase/internal/api/**'
      - 'client/packages/pocketcoder_api/**'
      - 'client/packages/pocketcoder_flutter/assets/pb_schema.json'
      - 'client/packages/pocketcoder_flutter/lib/**'
      - 'client/packages/pocketcoder_flutter/build.yaml'
      - 'client/packages/pocketcoder_flutter/pubspec.yaml'
      - 'client/packages/pocketcoder_flutter/scripts/generate_models.py'
      - 'client/pubspec.yaml'
      - 'client/pubspec.lock'
      - 'tooling/scripts/generate_flutter.sh'
      - 'tooling/scripts/generate_openapi*.sh'
      - '.github/workflows/openapi-contract.yml'
  push:
    branches: [main]
    paths:
      - 'api/openapi/**'
      - 'server/pocketbase/pb_migrations/schema.json'
      - 'server/pocketbase/internal/openapi/**'
      - 'server/pocketbase/internal/api/**'
      - 'client/packages/pocketcoder_api/**'
      - 'client/packages/pocketcoder_flutter/assets/pb_schema.json'
      - 'client/packages/pocketcoder_flutter/lib/**'
      - 'client/packages/pocketcoder_flutter/build.yaml'
      - 'client/packages/pocketcoder_flutter/pubspec.yaml'
      - 'client/packages/pocketcoder_flutter/scripts/generate_models.py'
      - 'client/pubspec.yaml'
      - 'client/pubspec.lock'
      - 'tooling/scripts/generate_flutter.sh'
      - 'tooling/scripts/generate_openapi*.sh'

jobs:
  contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and verify checked-in artifacts
        run: |
          ./tooling/scripts/generate_flutter.sh
          git diff --exit-code
      - name: Go contract tests
        working-directory: server/pocketbase
        run: go test ./internal/api ./internal/filesystem ./internal/openapi
      - name: Dart generated client tests
        working-directory: client
        run: dart test packages/pocketcoder_api
