# PocketCoder NixOS Image — Build & Publish

name: Build NixOS Image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-nixos'

permissions:
  contents: write

concurrency:
  group: nixos-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-25.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build Linode image
        working-directory: deploy/nixos
        run: nix build .#linode-image --print-build-logs

      - name: Compress image
        run: gzip -c deploy/nixos/result/nixos.img > pocketcoder-nixos.img.gz

      - name: Compute image metadata
        id: meta
        run: |
          SHA256=$(sha256sum pocketcoder-nixos.img.gz | cut -d' ' -f1)
          UNCOMPRESSED_BYTES=$(stat -c%s deploy/nixos/result/nixos.img)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "uncompressed_bytes=$UNCOMPRESSED_BYTES" >> "$GITHUB_OUTPUT"
          echo "Image sha256: $SHA256"
          echo "Uncompressed bytes: $UNCOMPRESSED_BYTES"

      - name: Check image size
        run: |
          SIZE=$(stat -c%s pocketcoder-nixos.img.gz)
          echo "Compressed image size: $SIZE bytes ($((SIZE / 1024 / 1024)) MiB)"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp pocketcoder-nixos.img.gz \
            s3://pocketcoder-images/pocketcoder-nixos-${{ github.sha }}.img.gz \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: Publish manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          cat > manifest.json <<EOF
          {
            "url": "https://images.pocketcoder.dev/pocketcoder-nixos-${{ github.sha }}.img.gz",
            "sha256": "${{ steps.meta.outputs.sha256 }}",
            "uncompressedBytes": ${{ steps.meta.outputs.uncompressed_bytes }}
          }
          EOF
          aws s3 cp manifest.json \
            s3://pocketcoder-images/image-manifest.json \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-image
          path: pocketcoder-nixos.img.gz
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nixos-image

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pocketcoder-nixos.img.gz
          generate_release_notes: true
