# PocketCoder NixOS Image — Build & Publish

name: Build NixOS Image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-nixos'

permissions:
  contents: write

concurrency:
  group: nixos-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-25.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build Linode image
        working-directory: deploy/nixos
        run: nix build .#linode-image --print-build-logs

      - name: Compress image
        run: gzip -c deploy/nixos/result/nixos.img > pocketcoder-nixos.img.gz

      - name: Check image size
        run: |
          SIZE=$(stat -c%s pocketcoder-nixos.img.gz)
          echo "Compressed image size: $SIZE bytes ($((SIZE / 1024 / 1024)) MiB)"
          # `wrangler r2 object put` does a single non-multipart PUT and
          # rejects anything over ~300MiB -- fail loudly here instead of
          # letting that step fail cryptically (or silently write to a
          # local simulated bucket if --remote is ever dropped by mistake).
          if [ "$SIZE" -gt $((300 * 1024 * 1024)) ]; then
            echo "::error::Image is $((SIZE / 1024 / 1024))MiB, over wrangler's ~300MiB r2 object put limit. Needs a multipart/S3-API upload instead (see the CI workflow review notes)." >&2
            exit 1
          fi

      - name: Upload to R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put pocketcoder-images/pocketcoder-nixos-latest.img.gz --file=pocketcoder-nixos.img.gz --remote

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-image
          path: pocketcoder-nixos.img.gz
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nixos-image

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pocketcoder-nixos.img.gz
          generate_release_notes: true
