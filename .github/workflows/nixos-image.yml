# PocketCoder NixOS Image — Build & Publish

name: Build NixOS Image

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build and publish an immutable GitHub-attested NixOS candidate
        required: true
        default: build_candidate
        type: choice
        options:
          - build_candidate
      attest_branch:
        description: >-
          Bake POCKETCODER_GITHUB_WORKFLOW_BRANCH into the image as the
          checked-out ref instead of "main". Explicit opt-in only -- never
          set automatically by a push, even to staging -- so a normal
          staging push still produces a "main"-trusting image and a VPS
          script test that wants a staging-trusting one has to ask for it.
        required: false
        default: false
        type: boolean
      force_rebuild:
        description: >-
          Skip the actions/cache lookup and always build a fresh image,
          even if a cache entry for this exact drv hash already exists.
          Use this if the cache is suspected stale/corrupt. Note: this
          still writes a fresh cache entry afterward, but does not delete
          any existing bad entry at the same key. Removing an old entry
          requires a separate `gh cache delete` if it is actually corrupt
          rather than merely suspected stale.
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*-nixos'

permissions:
  contents: read

concurrency:
  # Includes the ref so a manual vps-test candidate build (see the
  # `candidate` job below) can never share a group -- and therefore never
  # cancel-in-progress -- with a real main/staging release build.
  group: nixos-image-${{ github.event.inputs.operation || 'build_candidate' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' || inputs.operation == 'build_candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Guard release-branch.nix is never committed as non-main
        run: |
          test "$(tail -n1 deploy/nixos/release-branch.nix)" = '"main"' || {
            echo 'release-branch.nix must stay "main" in the repo; only this workflow, via the attest_branch input, may override it at build time.'
            exit 1
          }

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          nix_path: nixpkgs=channel:nixos-26.05
          # Explicit, visible pin (matching this action revision's own
          # default) rather than leaving Nix version implicit -- an
          # unpinned default that changes on a future action-SHA bump would
          # silently shift the drv-hash cache key's behavior with no signal
          # other than a sudden drop in hit rate.
          install_url: https://releases.nixos.org/nix/nix-2.24.9/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: status.sh bats tests
        # deploy/nixos/tests/status-json.bats already exercises
        # pc_status_init (every fresh box's very first status write) and
        # would have caught the "jq: error: Could not open file {}"
        # first-boot crash this session found live -- it just was never
        # wired into any CI job. Runs on plain bash + jq, no docker/compose
        # services needed, so it's cheap to run directly here rather than
        # through the docker-compose bats setup the acceptance suites use.
        run: nix run nixpkgs#bats -- deploy/nixos/tests/status-json.bats

      - name: NixOS flake checks
        # Runs every check.${system} declared in flake.nix together (today:
        # ordering, caddyfile-validate, systemd-units), so a new check added
        # later is picked up automatically instead of needing this workflow
        # edited to name it explicitly. Unconditional, always runs whether
        # the image build below ends up cached or not -- these are
        # correctness gates, never skipped.
        run: nix flake check ./deploy/nixos --system x86_64-linux -L

      - name: Write effective release-branch.nix
        # Minimal, narrow relocation of exactly this one existing line from
        # the old "Build Linode image" step -- nothing else about this
        # workflow's step order changes. release-branch.nix's value is a
        # real Nix derivation input (it's threaded into a systemd unit's
        # environment via bootstrap.nix), so the drv-hash cache key
        # computed below needs to see its final, effective value -- which
        # used to only be written this late, right before the build.
        working-directory: deploy/nixos
        env:
          ATTEST_BRANCH: ${{ inputs.attest_branch }}
        run: |
          # Only ever overwritten by this explicit, non-default input --
          # never automatically because the ref happens to be staging.
          if [ "$ATTEST_BRANCH" = "true" ]; then
            printf '"%s"\n' "${GITHUB_REF#refs/heads/}" > release-branch.nix
          fi

      - name: Validate the drv-hash cache key's dependency tracking
        # Standing, fail-closed/warn-only two-direction gate. Runs against a
        # scratch copy so it never touches the real checkout the rest of this
        # job uses.
        working-directory: deploy/nixos
        run: |
          set -euo pipefail
          baseline=$(nix eval --raw .#linode-image.drvPath)
          scratch=$(mktemp -d)
          cp -a "$GITHUB_WORKSPACE/." "$scratch/"
          cd "$scratch/deploy/nixos"
          git -C "$scratch" config user.email "ci@pocketcoder.local"
          git -C "$scratch" config user.name "nixos-cache-key-gate"

          # Safety check: a known real, escaping-relative-path dependency
          # must move the hash. This is the dangerous direction -- a real
          # input silently NOT moving the hash would mean a future change
          # to it gets served stale from cache with no error at all -- so
          # this fails the whole job if it doesn't hold.
          echo "// nixos-cache-key-gate safety perturbation" \
            >> "$scratch/deploy/release-manager/internal/tlscert/tlscert.go"
          git -C "$scratch" add -A
          git -C "$scratch" commit -q -m "cache-key-gate: safety perturbation"
          test -n "$(git -C "$scratch" log -1 --format=%H)"
          safety=$(nix eval --raw .#linode-image.drvPath)
          if [ "$safety" = "$baseline" ]; then
            echo "::error::drv-hash key gate FAILED (safety): a real dependency (deploy/release-manager/internal/tlscert/tlscert.go) did not move the cache key. The key can no longer be trusted -- treat this as build-breaking." >&2
            exit 1
          fi
          git -C "$scratch" reset -q --hard HEAD~1

          # Efficiency check: a file genuinely out of scope for
          # packages.linode-image (only reachable via checks.ordering, a
          # separate flake output `nix eval .#linode-image.drvPath` never
          # forces) must NOT move the hash. Regressing here only costs
          # cache-hit-rate/CI time, not correctness -- warn, don't fail.
          echo "# nixos-cache-key-gate efficiency perturbation" \
            >> "$scratch/deploy/nixos/tests/ordering.nix"
          git -C "$scratch" add -A
          git -C "$scratch" commit -q -m "cache-key-gate: efficiency perturbation"
          efficiency=$(nix eval --raw .#linode-image.drvPath)
          if [ "$efficiency" != "$baseline" ]; then
            echo "::warning::drv-hash key gate regression (efficiency): an out-of-scope file (deploy/nixos/tests/ordering.nix) moved the cache key. Not a correctness issue, but the cache will hit less than it should -- worth investigating." >&2
          fi

          rm -rf "$scratch"

      - name: Compute the cache key
        id: cache-key
        working-directory: deploy/nixos
        run: |
          drv_hash=$(nix eval --raw .#linode-image.drvPath | sed -E 's#^/nix/store/([^-]+)-.*#\1#')
          post_build_hash=${{ hashFiles('deploy/scripts/build-nixos-artifacts.sh', 'deploy/scripts/write-artifact-metadata.sh') }}
          echo "key=nixos-image-v2-$drv_hash-$post_build_hash" >> "$GITHUB_OUTPUT"

      - name: Restore cached image + metadata
        id: restore
        if: inputs.force_rebuild != true
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            artifacts
            nixos-release-metadata.json
          key: ${{ steps.cache-key.outputs.key }}

      - name: Verify restored cache contents
        # Defense in depth: upload-artifact's default if-no-files-found is
        # `warn`, not a hard failure, so a corrupt/partial cache entry would
        # otherwise surface as a confusing failure several steps later in
        # the downstream `candidate` job instead of here, immediately.
        if: steps.restore.outputs.cache-hit == 'true'
        run: |
          test -d artifacts && test -n "$(find artifacts -maxdepth 1 -name '*.img.gz' -print -quit)" || {
            echo "::error::cache-hit reported true but artifacts/*.img.gz is missing" >&2
            exit 1
          }
          test -s nixos-release-metadata.json || {
            echo "::error::cache-hit reported true but nixos-release-metadata.json is missing" >&2
            exit 1
          }

      - name: Build Linode image
        if: steps.restore.outputs.cache-hit != 'true'
        working-directory: deploy/nixos
        run: nix build .#linode-image --print-build-logs

      - name: Build image artifacts + metadata
        if: steps.restore.outputs.cache-hit != 'true'
        run: sh deploy/scripts/build-nixos-artifacts.sh deploy/nixos/result/nixos.img

      - name: Save image + metadata to cache
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            artifacts
            nixos-release-metadata.json
          key: ${{ steps.cache-key.outputs.key }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nixos-image
          path: artifacts/*.img.gz
          retention-days: 30

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nixos-release-metadata
          path: nixos-release-metadata.json
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nixos-image

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: '*.img.gz'
          generate_release_notes: true

  # Publishes the runtime snapshot, core, independently selectable harnesses,
  # and optional local-model runtime. The candidate job couples these to the
  # NixOS image so every candidate manifest names one complete release.
  release-artifacts:
    if: github.event_name == 'push' || inputs.operation == 'build_candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: deploy/release-manager/go.mod
          cache-dependency-path: deploy/release-manager/go.sum

      - name: Test native OS release manager
        working-directory: deploy/release-manager
        run: go test ./...

      - name: Validate release contract and deployment snapshot
        run: |
          set -euo pipefail
          python3 -m pip install -r deploy/release/requirements.txt
          deploy/release/generate-release-schemas.sh
          git diff --exit-code -- 'deploy/release/*.schema.json'
          deploy/release/tests/release-schema-test.sh
          deploy/release/tests/release-contract-test.sh

      # Candidate rebuilds its own release artifacts. Keeping the 1+ GiB
      # compressed archive inside GitHub Actions only as a job handoff is
      # unreliable on this runner; R2 is the authoritative distribution
      # handoff after the final manifest is attested.

  # Assemble and publish the immutable candidate after both the NixOS image
  # and split Docker artifacts exist. This job cannot move public pointers.
  #
  # vps-test/* is a deliberate carve-out: it lets the VPS suite mint a real,
  # attested candidate pinned to a NixOS version other than staging/main's
  # current one (e.g. an older nixos-version.nix/flake.nix pair) so
  # upgrade-os's live round trip has a real "release B" to upgrade from,
  # without ever touching staging's or main's actual pointer. Nothing
  # outside this job's own publish step treats a vps-test/* build as a
  # promotable release -- promotion/channel movement is untouched.
  candidate:
    needs: [build, release-artifacts]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/vps-test/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: deploy/release-manager/go.mod
          cache-dependency-path: deploy/release-manager/go.sum

      - name: Download NixOS metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nixos-release-metadata
          path: candidate

      - name: Download NixOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nixos-image
          path: candidate/artifacts

      - name: Assemble and validate canonical candidate
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p candidate/documents
          python3 -m pip install -r deploy/release/requirements.txt
          deploy/ci/build-release-artifacts.sh "$SOURCE_COMMIT" \
            candidate/artifacts candidate/metadata \
            candidate/release-artifacts-metadata.json
          deploy/ci/assemble-release-manifest.sh "$SOURCE_COMMIT" \
            candidate/nixos-release-metadata.json \
            candidate/release-artifacts-metadata.json \
            candidate/release-manifest.json candidate/documents
          deploy/release/tests/release-schema-test.sh

      - name: Attest canonical candidate
        id: attest-candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            candidate/release-manifest.json
            candidate/artifacts/*
            candidate/documents/*

      - name: Preserve candidate attestation bundle
        run: |
          sha256sum candidate/release-manifest.json | cut -d' ' -f1 > candidate/manifest.sha256
          SHA256=$(cat candidate/manifest.sha256)
          mkdir -p candidate/attestations/releases
          cp "${{ steps.attest-candidate.outputs.bundle-path }}" \
            "candidate/attestations/releases/$SHA256.sigstore.json"

      - name: Publish immutable GitHub-attested candidate
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          deploy/ci/publish-attested-candidate.sh candidate \
            "candidate/attestations/releases/$(cat candidate/manifest.sha256).sigstore.json"

      - name: Upload canonical candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate
          retention-days: 30

      - name: Upload immutable candidate identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-manifest-${{ github.sha }}
          path: candidate/manifest.sha256
          retention-days: 30
