# PocketCoder NixOS Image — Build & Publish

name: Build NixOS Image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-nixos'

permissions:
  contents: read

concurrency:
  group: nixos-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          nix_path: nixpkgs=channel:nixos-26.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build Linode image
        working-directory: deploy/nixos
        run: |
          # Embed the exact source revision into bootstrap.nix. The first
          # boot must clone this revision, never whatever happens to be on
          # main when a customer deploys later.
          printf '"%s"\n' "$GITHUB_SHA" > release-commit.nix
          nix build .#linode-image --print-build-logs

      - name: Compress image
        run: gzip -c deploy/nixos/result/nixos.img > pocketcoder-nixos.img.gz

      - name: Compute image metadata
        id: meta
        run: |
          SHA256=$(sha256sum pocketcoder-nixos.img.gz | cut -d' ' -f1)
          UNCOMPRESSED_BYTES=$(stat -c%s deploy/nixos/result/nixos.img)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "uncompressed_bytes=$UNCOMPRESSED_BYTES" >> "$GITHUB_OUTPUT"
          echo "Image sha256: $SHA256"
          echo "Uncompressed bytes: $UNCOMPRESSED_BYTES"

      - name: Check image size
        run: |
          SIZE=$(stat -c%s pocketcoder-nixos.img.gz)
          echo "Compressed image size: $SIZE bytes ($((SIZE / 1024 / 1024)) MiB)"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp pocketcoder-nixos.img.gz \
            s3://pocketcoder-images/pocketcoder-nixos-${{ github.sha }}.img.gz \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com


      - name: Write release metadata
        run: |
          cat > nixos-release-metadata.json <<EOF
          {
            "sourceCommit": "${{ github.sha }}",
            "url": "https://images.pocketcoder.org/pocketcoder-nixos-${{ github.sha }}.img.gz",
            "sha256": "${{ steps.meta.outputs.sha256 }}",
            "uncompressedBytes": ${{ steps.meta.outputs.uncompressed_bytes }}
          }
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nixos-image
          path: pocketcoder-nixos.img.gz
          retention-days: 30

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nixos-release-metadata
          path: nixos-release-metadata.json
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nixos-image

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: pocketcoder-nixos.img.gz
          generate_release_notes: true

  # Pre-builds the app stack's Docker images and caches them in the same R2
  # bucket as the NixOS image, so bootstrap.nix can `docker load` a
  # pre-built tarball instead of compiling PocketBase (Go) and goose (Rust)
  # from source on every fresh box -- that from-source build was ~2-3 of
  # the ~12 minutes a real golden-path deploy took (verified via live
  # timing). Same trigger as the `build` job (manual dispatch or a
  # `v*-nixos` tag) rather than every push, so this doesn't rebuild/upload
  # on every dev commit -- deliberately kept coupled to the NixOS image's
  # own release cadence so the two artifacts never drift out of sync.
  # bootstrap.nix falls back to building from source if this cache is
  # missing, stale, or fails to verify, so skipping this job (or landing
  # code between tags) never breaks a deploy -- it just makes it slower.
  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Build app-stack images
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # -p pocketcoder pins the image name prefix (pocketcoder-<service>)
          # to match what bootstrap.nix's `docker compose up -d` produces --
          # it always runs from /opt/pocketcoder, so its default Compose
          # project name is "pocketcoder" too. Without this pin, CI's
          # checkout directory name deciding the project name would be an
          # implicit coincidence, not a guarantee.
          # Ollama is a pre-built upstream image, unlike the app images below;
          # pull it explicitly so it is included in the same verified cache.
          docker compose -p pocketcoder pull ollama
          docker compose -p pocketcoder --profile harness-images build \
            pocketbase goose mcp-gateway \
            claude-code-harness-image codex-harness-image opencode-harness-image

      - name: Save + compress images
        run: |
          set -euo pipefail
          # Compose pulls Ollama by the digest pinned in docker-compose.yml.
          # Resolve every required image from Compose instead of assuming
          # mutable `:latest` tags exist locally. Goose is intentionally
          # version-tagged while the locally built app images use the default
          # tag, so hardcoding tags here would drift from docker-compose.yml.
          IMAGES=$(docker compose -p pocketcoder config --images \
            | grep -E '^(pocketcoder-(pocketbase|goose|mcp-gateway)(:|$)|pocketcoder-harness-(claude-code|codex|opencode):|ollama/ollama@)')
          test -n "$IMAGES"
          IMAGE_IDS=""
          while IFS= read -r image; do
            test -n "$image"
            image_id=$(docker image inspect "$image" --format '{{.Id}}')
            test -n "$image_id"
            IMAGE_IDS="$IMAGE_IDS $image_id"
          done <<EOF
$IMAGES
EOF
          # Save local image IDs so digest-pinned references are handled by
          # Docker consistently across runner versions.
          docker save $IMAGE_IDS \
            | gzip > pocketcoder-docker-images.tar.gz

      - name: Compute image metadata
        id: meta
        run: |
          SHA256=$(sha256sum pocketcoder-docker-images.tar.gz | cut -d' ' -f1)
          SIZE=$(stat -c%s pocketcoder-docker-images.tar.gz)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Docker image cache sha256: $SHA256"
          echo "Compressed size: $SIZE bytes ($((SIZE / 1024 / 1024)) MiB)"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp pocketcoder-docker-images.tar.gz \
            s3://pocketcoder-images/pocketcoder-docker-images-${{ github.sha }}.tar.gz \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: Write release metadata
        run: |
          cat > docker-images-release-metadata.json <<EOF
          {
            "sourceCommit": "${{ github.sha }}",
            "url": "https://images.pocketcoder.org/pocketcoder-docker-images-${{ github.sha }}.tar.gz",
            "sha256": "${{ steps.meta.outputs.sha256 }}"
          }
          EOF

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-images-release-metadata
          path: docker-images-release-metadata.json
          retention-days: 30

  # Promotion is deliberately the only job that updates mutable pointers.
  # A failed or partial build can publish immutable objects, but it cannot
  # make them the release used by new deployments.
  promote:
    needs: [build, docker-images]
    runs-on: ubuntu-latest
    steps:
      - name: Download NixOS metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nixos-release-metadata

      - name: Download Docker metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-images-release-metadata

      - name: Validate and publish coupled release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          SOURCE_COMMIT: ${{ github.sha }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          test "$(jq -r .sourceCommit nixos-release-metadata.json)" = "$SOURCE_COMMIT"
          test "$(jq -r .sourceCommit docker-images-release-metadata.json)" = "$SOURCE_COMMIT"

          NIXOS=$(cat nixos-release-metadata.json)
          DOCKER=$(cat docker-images-release-metadata.json)
          jq -n \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --argjson nixos "$NIXOS" \
            --argjson dockerImages "$DOCKER" \
            '{schemaVersion: 1, sourceCommit: $sourceCommit,
              nixosImage: $nixos, dockerImages: $dockerImages,
              standardLinux: {mode: "cloud-init"}}' \
            > release-manifest.json

          # Immutable release record first.
          aws s3 cp release-manifest.json \
            "s3://pocketcoder-images/release-${SOURCE_COMMIT}.json" \
            --endpoint-url "$R2_ENDPOINT"

          # Legacy upload-image/bootstrap consumers retain their old object
          # names, but these mutable aliases are promoted only after both
          # immutable artifacts have passed validation.
          aws s3 cp \
            "s3://pocketcoder-images/pocketcoder-nixos-${SOURCE_COMMIT}.img.gz" \
            s3://pocketcoder-images/pocketcoder-nixos-latest.img.gz \
            --copy-props none \
            --endpoint-url "$R2_ENDPOINT"
          aws s3 cp \
            "s3://pocketcoder-images/pocketcoder-docker-images-${SOURCE_COMMIT}.tar.gz" \
            s3://pocketcoder-images/pocketcoder-docker-images-latest.tar.gz \
            --copy-props none \
            --endpoint-url "$R2_ENDPOINT"

          # These pointers are updated only after both artifact jobs and the
          # coupled release record are valid.
          cp nixos-release-metadata.json image-manifest.json
          cp docker-images-release-metadata.json docker-images-manifest.json
          aws s3 cp release-manifest.json \
            s3://pocketcoder-images/release-manifest.json \
            --endpoint-url "$R2_ENDPOINT"
          aws s3 cp image-manifest.json \
            s3://pocketcoder-images/image-manifest.json \
            --endpoint-url "$R2_ENDPOINT"
          aws s3 cp docker-images-manifest.json \
            s3://pocketcoder-images/docker-images-manifest.json \
            --endpoint-url "$R2_ENDPOINT"
