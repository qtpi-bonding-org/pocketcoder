# PocketCoder NixOS Image — Build & Publish

name: Build NixOS Image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-nixos'

permissions:
  contents: write

concurrency:
  group: nixos-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-25.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build Linode image
        working-directory: deploy/nixos
        run: nix build .#linode-image --print-build-logs

      - name: Compress image
        run: gzip -c deploy/nixos/result/nixos.img > pocketcoder-nixos.img.gz

      - name: Check image size
        run: |
          SIZE=$(stat -c%s pocketcoder-nixos.img.gz)
          echo "Compressed image size: $SIZE bytes ($((SIZE / 1024 / 1024)) MiB)"

      - name: Upload to R2
        # ubuntu-latest ships with AWS CLI v2 preinstalled -- no setup step needed.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        # wrangler's `r2 object put` is a single non-multipart PUT capped at
        # ~300MiB -- this image is ~755MiB. `aws s3 cp` multiparts large
        # uploads automatically (no extra flags needed) via R2's
        # S3-compatible API.
        run: |
          aws s3 cp pocketcoder-nixos.img.gz \
            s3://pocketcoder-images/pocketcoder-nixos-latest.img.gz \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-image
          path: pocketcoder-nixos.img.gz
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nixos-image

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pocketcoder-nixos.img.gz
          generate_release_notes: true
