# PocketCoder NixOS Image — Build & Publish

name: Build NixOS Image

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build an immutable candidate or promote one already built
        required: true
        default: build_candidate
        type: choice
        options:
          - build_candidate
          - promote_candidate
      release_sha:
        description: Exact candidate commit to promote
        required: false
        type: string
  push:
    tags:
      - 'v*-nixos'

permissions:
  contents: read

concurrency:
  group: nixos-image-${{ github.event.inputs.operation || 'build_candidate' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' || inputs.operation == 'build_candidate'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Guard release-commit.nix on the default branch
        if: github.ref == 'refs/heads/main'
        run: |
          test "$(tail -n1 deploy/nixos/release-commit.nix)" = '"main"' || {
            echo 'release-commit.nix must be "main" on the default branch.'
            exit 1
          }

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          nix_path: nixpkgs=channel:nixos-26.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: NixOS ordering check
        run: nix build ./deploy/nixos#checks.x86_64-linux.ordering -L

      - name: Build Linode image
        working-directory: deploy/nixos
        run: |
          # Embed the exact source revision into bootstrap.nix. First boot
          # resolves the coupled immutable release for this revision, never
          # whatever happens to be on main when a customer deploys later.
          printf '"%s"\n' "$GITHUB_SHA" > release-commit.nix
          nix build .#linode-image --print-build-logs

      - name: Compress image
        run: gzip -c deploy/nixos/result/nixos.img > pocketcoder-nixos.img.gz

      - name: Compute image metadata
        id: meta
        run: |
          SHA256=$(sha256sum pocketcoder-nixos.img.gz | cut -d' ' -f1)
          UNCOMPRESSED_BYTES=$(stat -c%s deploy/nixos/result/nixos.img)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "uncompressed_bytes=$UNCOMPRESSED_BYTES" >> "$GITHUB_OUTPUT"
          echo "Image sha256: $SHA256"
          echo "Uncompressed bytes: $UNCOMPRESSED_BYTES"

      - name: Check image size
        run: |
          SIZE=$(stat -c%s pocketcoder-nixos.img.gz)
          echo "Compressed image size: $SIZE bytes ($((SIZE / 1024 / 1024)) MiB)"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp pocketcoder-nixos.img.gz \
            s3://pocketcoder-images/pocketcoder-nixos-${{ github.sha }}.img.gz \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com


      - name: Write release metadata
        run: |
          sh deploy/scripts/write-artifact-metadata.sh \
            nixos-release-metadata.json \
            "https://images.pocketcoder.org/pocketcoder-nixos-${{ github.sha }}.img.gz" \
            pocketcoder-nixos.img.gz \
            "${{ steps.meta.outputs.uncompressed_bytes }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nixos-image
          path: pocketcoder-nixos.img.gz
          retention-days: 30

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nixos-release-metadata
          path: nixos-release-metadata.json
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nixos-image

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: pocketcoder-nixos.img.gz
          generate_release_notes: true

  # Publishes the runtime snapshot, core, independently selectable harnesses,
  # and optional local-model runtime. The candidate job couples these to the
  # NixOS image so every candidate manifest names one complete release.
  release-artifacts:
    if: github.event_name == 'push' || inputs.operation == 'build_candidate'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Validate release contract and deployment snapshot
        run: |
          set -euo pipefail
          deploy/release/tests/release-contract-test.sh

      - name: Build split release artifacts and metadata
        run: deploy/ci/build-release-artifacts.sh "$GITHUB_SHA"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          for artifact in artifacts/*.tar.gz; do
            aws s3 cp "$artifact" \
              "s3://pocketcoder-images/$(basename "$artifact")" \
              --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          done

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts-metadata
          path: release-artifacts-metadata.json
          retention-days: 30

  # Assemble and publish the immutable candidate after both the NixOS image
  # and split Docker artifacts exist. This job cannot move public pointers.
  candidate:
    needs: [build, release-artifacts]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Download NixOS metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nixos-release-metadata

      - name: Download release artifact metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts-metadata

      - name: Validate and publish immutable candidate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          SOURCE_COMMIT: ${{ github.sha }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: deploy/ci/publish-release-candidate.sh "$SOURCE_COMMIT"

  # Promotion is the only operation allowed to update mutable discovery
  # pointers. It consumes a previously built candidate by exact commit and
  # never rebuilds or substitutes artifacts.
  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'promote_candidate'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Validate promotion input
        env:
          SOURCE_COMMIT: ${{ inputs.release_sha }}
        run: |
          case "$SOURCE_COMMIT" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#SOURCE_COMMIT}" -eq 40

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.release_sha }}

      - name: Promote immutable candidate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          SOURCE_COMMIT: ${{ inputs.release_sha }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: deploy/ci/promote-release.sh "$SOURCE_COMMIT"
