name: Release Attestation Spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest-fixture:
    name: Attest and retain a verification fixture
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build deterministic fixture
        run: |
          mkdir -p attestation-spike
          printf 'PocketCoder GitHub attestation fixture\ncommit=%s\n' "$GITHUB_SHA" \
            > attestation-spike/release-fixture.txt

      - name: Attest fixture
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: attestation-spike/release-fixture.txt

      - name: Preserve exact fixture and Sigstore bundle
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" attestation-spike/bundle.sigstore.json
          sha256sum attestation-spike/release-fixture.txt > attestation-spike/SHA256SUMS

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: deploy/release-manager/go.mod

      - name: Verify through PocketCoder's native production path
        working-directory: deploy/release-manager
        run: |
          go run ./cmd/pocketcoder-attest-verify \
            --artifact ../../attestation-spike/release-fixture.txt \
            --bundle ../../attestation-spike/bundle.sigstore.json \
            --workflow-ref .github/workflows/release-attestation-spike.yml@refs/heads/main \
            --tuf-cache "$RUNNER_TEMP/pocketcoder-sigstore-tuf"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-attestation-spike-${{ github.run_id }}
          path: attestation-spike
          retention-days: 30
