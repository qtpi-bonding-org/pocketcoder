name: FOSS Purity Check

on:
  push:
    branches: [main]
    paths:
      - 'client/packages/pocketcoder_flutter/**'
      - 'client/apps/pocketcoder_foss/**'
      - 'client/pubspec.lock'
      - 'client/pubspec.yaml'
      - 'client/scripts/purity_check.sh'
      - 'client/scripts/check_license_purity.py'
  pull_request:
    paths:
      - 'client/packages/pocketcoder_flutter/**'
      - 'client/apps/pocketcoder_foss/**'
      - 'client/pubspec.lock'
      - 'client/pubspec.yaml'
      - 'client/scripts/purity_check.sh'
      - 'client/scripts/check_license_purity.py'

permissions:
  contents: read

concurrency:
  group: foss-purity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The workspace resolves private qtpi-bonding-org packages over SSH.
      # Keep the key in GitHub Actions secrets; never put it in pubspec files
      # or the repository. This explicit check turns the previous opaque git
      # authentication error into an actionable CI failure.
      - name: Verify Flutter dependency deploy key
        env:
          FLUTTER_DEPS_DEPLOY_KEY: ${{ secrets.FLUTTER_DEPS_DEPLOY_KEY }}
        run: |
          test -n "$FLUTTER_DEPS_DEPLOY_KEY" || {
            echo "FLUTTER_DEPS_DEPLOY_KEY is not configured; private Flutter dependencies cannot be resolved." >&2
            exit 1
          }

      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.FLUTTER_DEPS_DEPLOY_KEY }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: Resolve workspace dependencies
        working-directory: client
        run: |
          set -euo pipefail
          FOSS_WORKSPACE="$RUNNER_TEMP/pocketcoder-foss-workspace"
          mkdir -p "$FOSS_WORKSPACE/packages" "$FOSS_WORKSPACE/apps"
          cp -R packages/pocketcoder_flutter "$FOSS_WORKSPACE/packages/"
          cp -R apps/pocketcoder_foss "$FOSS_WORKSPACE/apps/"
          cp pubspec.foss-ci.yaml "$FOSS_WORKSPACE/pubspec.yaml"
          (cd "$FOSS_WORKSPACE" && flutter pub get)
          echo "PURITY_CLIENT_DIR=$FOSS_WORKSPACE" >> "$GITHUB_ENV"

      - name: Run purity check
        working-directory: client
        run: |
          ./scripts/purity_check.sh packages/pocketcoder_flutter
          ./scripts/purity_check.sh apps/pocketcoder_foss
