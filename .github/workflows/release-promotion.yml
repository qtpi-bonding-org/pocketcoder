name: Promote NixOS Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to advance
        required: true
        type: choice
        options: [stable, beta, nightly]
      manifest_sha256:
        description: Immutable candidate manifest SHA-256
        required: true
        type: string
      sequence:
        description: Next monotonic channel sequence, or next to allocate it from R2
        required: true
        default: next
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  promote:
    # vps-test/* may only ever promote to beta -- enforced in
    # promote-latest-candidate.sh, the only caller that can reach this
    # workflow with a vps-test/* ref -- so it lands on beta-testing.json,
    # never nightly-testing.json (the everyday VPS suite's own pointer) or
    # any bare, main-trust-reachable pointer.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/vps-test/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install contract validator
        run: python3 -m pip install -r deploy/release/requirements.txt

      - name: Verify candidate is publicly reachable before promoting
        run: deploy/ci/verify-candidate-published.sh '${{ inputs.manifest_sha256 }}'

      # Every non-main branch gets its own, fixed "-testing" channel-pointer
      # object, so a staging-branch promotion can never overwrite (or be
      # confused with) main's -- confirmed live: before this existed, a
      # staging promotion onto the shared "nightly.json" broke bootstrap for
      # every ordinary main-trust box. This is derived from the triggering
      # ref, never a workflow_dispatch input, so it can't be forgotten or
      # typo'd. A fixed "-testing" suffix (not the literal branch name)
      # keeps the public path meaningful regardless of which branch it is --
      # see internal/release/resolver.go's ChannelPath, which this must stay
      # in sync with.
      - name: Compute branch-qualified channel path
        id: channel-path
        run: |
          if [ "${{ github.ref_name }}" = main ]; then
            echo 'channel_path=${{ inputs.channel }}' >> "$GITHUB_OUTPUT"
          else
            echo 'channel_path=${{ inputs.channel }}-testing' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare channel pointer
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: deploy/ci/prepare-attested-channel-pointer.sh '${{ inputs.channel }}' '${{ steps.channel-path.outputs.channel_path }}' '${{ inputs.manifest_sha256 }}' '${{ inputs.sequence }}' channel-pointer.json

      - name: Attest channel pointer
        id: attest-pointer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: channel-pointer.json

      - name: Publish channel pointer
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: deploy/ci/publish-attested-channel-pointer.sh channel-pointer.json '${{ steps.attest-pointer.outputs.bundle-path }}' '${{ steps.channel-path.outputs.channel_path }}'
