services:
  # 🏰 POCKETBASE CORE (Backend Only)
  pocketbase:
    build:
      context: .
      dockerfile: server/pocketbase/Dockerfile
    container_name: pocketcoder-pocketbase
    ports:
      # Loopback-only: Caddy (host-level, see deploy/nixos/caddy.nix) proxies
      # this over TLS. Publishing on 0.0.0.0 would let anyone reach PocketBase
      # in plaintext on the public IP -- Docker's port-forwarding runs ahead
      # of/outside the host firewall's INPUT chain, so the firewall alone
      # can't block it.
      - "127.0.0.1:8090:8090" # PocketBase UI

    volumes:
      - pb_data:/app/pb_data
      # - pb_backups:/app/pb_backups
      - pocketcoder-logs:/app/pb_public/logs
      - goose_workspace:/workspace
      - ./server/mcp-gateway/config:/mcp_config
      - llm_keys:/llm_keys
      - goose_config:/goose-config
      - cognee_config:/cognee-config
    environment:
      - POCKETBASE_SUPERUSER_EMAIL=${POCKETBASE_SUPERUSER_EMAIL}
      - POCKETBASE_SUPERUSER_PASSWORD=${POCKETBASE_SUPERUSER_PASSWORD}
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD}
      - AGENT_EMAIL=${AGENT_EMAIL}
      - AGENT_PASSWORD=${AGENT_PASSWORD}
      - PN_PROVIDER=${PN_PROVIDER}
      - PN_URL=${PN_URL}
      - PN_RELAY_SECRET=${PN_RELAY_SECRET}
      - DOCKER_HOST=tcp://docker-socket-proxy-write:2375
      # Direct authenticated c1 -> c2 WebSocket (goose enforces the secret on
      # the /acp upgrade as of v1.39; c1 sends it as ?token=). The secret is
      # REQUIRED for the `agent` profile — goose refuses to serve without it.
      # Leave it unset otherwise and the PocketBase agent route stays disabled.
      - GOOSE_ACP_URL=${GOOSE_ACP_URL:-ws://goose:3000/acp}
      - GOOSE_SERVER__SECRET_KEY=${GOOSE_SERVER__SECRET_KEY:-}
      - GOOSE_WORKSPACE=${GOOSE_WORKSPACE:-/workspace}
    command: ["/app/pocketbase", "serve", "--http=0.0.0.0:8090"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - pocketcoder-dashboard
      - pocketcoder-docker
      - pocketcoder-pocketbase-sdk
      - pocketcoder-tailscale
      - pocketcoder-agent

  # 🪿 GOOSE C2 (private agent core)
  # Starts only with `docker compose --profile agent up`. It never publishes a
  # host port; it shares only the private `pocketcoder-agent` ACP network with
  # PocketBase (authenticated WS) plus its own model-provider egress network.
  # goose is the sole system of record for history; PocketBase never calls it
  # back, so this network carries only c1 -> c2 ACP traffic.
  goose:
    build:
      context: server/goose
      dockerfile: Dockerfile
    container_name: pocketcoder-goose
    profiles: ["agent"]
    environment:
      - GOOSE_SERVER__SECRET_KEY=${GOOSE_SERVER__SECRET_KEY:-}
      - GOOSE_PROVIDER=${GOOSE_PROVIDER:-anthropic}
      - GOOSE_MODEL=${GOOSE_MODEL:-MiniMax-M2.5}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_HOST=${ANTHROPIC_HOST:-https://api.minimax.io/anthropic}
      - GOOSE_DISABLE_KEYRING=1
      - GOOSE_PATH_ROOT=/goose
      - GOOSE_TELEMETRY_ENABLED=false
    volumes:
      - goose_data:/goose
      # Goose derives its config dir from GOOSE_PATH_ROOT: /goose/config/config.yaml
      # (verified via `goose info`, spec §13.1). Mount the PocketBase-written
      # config volume there — nested inside goose_data — so Goose actually reads
      # the rendered config.yaml/keys.env. NOT ~/.config/goose (goose ignores it).
      - goose_config:/goose/config
      - goose_workspace:/workspace
    working_dir: /workspace
    networks:
      - pocketcoder-agent
      - pocketcoder-goose-egress
      - pocketcoder-mcp-gateway
      - pocketcoder-cognee
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 🔌 MCP GATEWAY (MCP Server Gateway)
  mcp-gateway:
    build:
      context: .
      dockerfile: server/mcp-gateway/Dockerfile
    container_name: pocketcoder-mcp-gateway
    profiles: ["c3"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./server/mcp-gateway/config:/root/.docker/mcp
    environment:
      - DOCKER_MCP_IN_CONTAINER=1
      - LINODE_TOKEN=${LINODE_TOKEN}
      - ENABLE_TF_OPERATIONS=${ENABLE_TF_OPERATIONS}
      - TFE_TOKEN=${TFE_TOKEN}
      - DOCKER_MCP_TELEMETRY_DEBUG=0
    command: ["--port", "8811", "--transport", "streaming", "--verbose", "--log-calls", "--log", "/var/log/mcp-gateway.log", "--catalog", "/root/.docker/mcp/docker-mcp.yaml", "--secrets", "/root/.docker/mcp/mcp.env", "--enable-all-servers"]
    networks:
      - pocketcoder-docker
      - pocketcoder-tools
      - pocketcoder-mcp-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8811/health"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s

  # 🧠 COGNEE (Agent Memory MCP Server)
  # Standalone MCP memory server for Goose — knowledge-graph + vector recall,
  # embedded storage (SQLite + LanceDB), no external DB services. Registered
  # as a live Goose extension by hooks.RegisterCogneeExtension (Task 6), not
  # via the mcp_servers/Docker-MCP-gateway catalog path.
  # One-shot init: Docker creates the cognee_data named volume root-owned on
  # first use, but cognee-mcp's image runs as a non-root uid/gid 1000:1000 —
  # without this, cognee crashes on its first write with
  # `PermissionError: /cognee_data/system` (verified empirically, see
  # spikes/cognee-mcp-transport/). Runs once, exits 0, cognee waits for it.
  cognee-data-init:
    image: busybox
    container_name: pocketcoder-cognee-data-init
    profiles: ["agent"]
    command: ["chown", "-R", "1000:1000", "/cognee_data"]
    volumes:
      - cognee_data:/cognee_data

  cognee:
    image: cognee/cognee-mcp:main
    container_name: pocketcoder-cognee
    profiles: ["agent"]
    depends_on:
      cognee-data-init:
        condition: service_completed_successfully
    environment:
      # TRANSPORT_MODE/HTTP_PORT/MCP_ALLOWED_HOSTS are consumed by the image's
      # own entrypoint.sh, not passed as --transport CLI args — the entrypoint
      # appends its own --transport $TRANSPORT_MODE after any passed args, so
      # a CLI --transport would be silently overridden back to stdio.
      # MCP_ALLOWED_HOSTS must match the service's network alias:port, else
      # every cross-container request 421s on the DNS-rebinding Host check.
      - TRANSPORT_MODE=http
      - HTTP_PORT=8000
      - MCP_ALLOWED_HOSTS=cognee:8000
      # cognee's own defaults (pydantic BaseSettings env vars, case-insensitive)
      # write its SQLite/LanceDB/Kuzu state under a path baked into the image
      # (~/.cognee_system, ~/.data_storage) — NOT under /cognee_data. Without
      # these two, the cognee_data volume mount below is a no-op: nothing is
      # ever written there, state doesn't persist across container recreates,
      # and sqlpage's read-only mount (below, and in the sqlpage service) has
      # nothing to read. Verified empirically: spikes/cognee-mcp-transport.
      - DATA_ROOT_DIRECTORY=/cognee_data/data
      - SYSTEM_ROOT_DIRECTORY=/cognee_data/system
      # No LLM_API_KEY/embedding env vars required just to boot — those are
      # consumed lazily by remember/recall tool calls. Task 5's render hook
      # writes real values into cognee_config later; the placeholder is here
      # so the compose file is self-describing about the var's existence.
      - LLM_API_KEY=${COGNEE_LLM_API_KEY:-}
    volumes:
      - cognee_data:/cognee_data
      - cognee_config:/cognee-config
    networks:
      - pocketcoder-cognee
    restart: unless-stopped
    healthcheck:
      # No curl/wget in this image, and cognee-mcp exposes no plain /health
      # route (the streamable-HTTP MCP endpoint 406s on non-MCP requests,
      # which still proves the process is up and listening) — so just
      # confirm the port accepts a TCP connection.
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 🔒 DOCKER SOCKET PROXY - WRITE (Security Layer for PocketBase)
  # Currently shared by both PocketBase (restart) and Dozzle (logs)
  # For production: uncomment docker-socket-proxy-read below and update Dozzle config
  docker-socket-proxy-write:
    image: tecnativa/docker-socket-proxy:0.3
    container_name: pocketcoder-docker-proxy-write
    environment:
      # Enable container operations for PocketBase restart capability
      - CONTAINERS=1          # Allow container operations (list, inspect, restart)
      - POST=1                # Allow POST requests (for restart)
      - EVENTS=1              # Allow streaming events (for Dozzle)
      - INFO=1                # Required for Dozzle to detect Docker version
      - IMAGES=0              # Disable image operations
      - NETWORKS=0            # Disable network operations
      - VOLUMES=0             # Disable volume operations
      - BUILD=0               # Disable build operations
      - COMMIT=0              # Disable commit operations
      - CONFIGS=0             # Disable config operations
      - DISTRIBUTION=0        # Disable distribution operations
      - EXEC=0                # Disable exec operations
      - PLUGINS=0             # Disable plugin operations
      - SECRETS=0             # Disable secrets operations
      - SERVICES=0            # Disable services operations
      - SESSION=0             # Disable session operations
      - SWARM=0               # Disable swarm operations
      - SYSTEM=0              # Disable system operations
      - TASKS=0               # Disable tasks operations
      - LOG_LEVEL=info        # Logging level
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pocketcoder-docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 📈 SQLPAGE (SQLite Dashboard)
  sqlpage:
    image: lovasoa/sqlpage:v0.32.0
    user: root
    container_name: pocketcoder-sqlpage
    environment:
      - SQLPAGE_ENVIRONMENT=production
      - SQLPAGE_SITE_PREFIX=/api/pocketcoder/proxy/observability/
    volumes:
      - pb_data:/database/pocketbase           # PocketBase DB (operational)
      - ./server/sqlpage/dashboard:/var/www:ro                  # SQLPage queries/dashboards
      # Config actually lives under dashboard/config/ (sqlpage.json,
      # config/on_connect.sql) — ./server/sqlpage/config doesn't exist on
      # disk at all. This mismatch predates this branch (confirmed on main)
      # and silently no-ops both sqlpage.json's database_url (SQLPage falls
      # back to a throwaway in-memory DB every restart) and on_connect.sql's
      # ATTACH statements (opencode/cognee dashboards error "no such table").
      - ./server/sqlpage/dashboard/config:/etc/sqlpage:ro       # Configuration (sqlpage.json, on_connect.sql)
      # opencode was removed from this repo entirely (see git history) — its
      # on_connect.sql ATTACH referenced a volume/path that no longer exists
      # anywhere in this compose file, which hard-fails the whole SQLPage
      # connection pool the moment the real /etc/sqlpage config actually
      # loads (fixed above). Replaced with goose's own SQLite session store
      # instead (data/sessions/sessions.db under GOOSE_PATH_ROOT=/goose, per
      # spikes/goose-acp-http/README.md — WAL mode, safe for concurrent
      # read-only access).
      - goose_data:/goose_data:ro
      - cognee_data:/cognee_data:ro
    networks:
      - pocketcoder-dashboard
      - pocketcoder-tailscale
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      pocketbase:
        condition: service_healthy

  # 🔔 NTFY (Optional Sovereign Notification Server)
  # To enable: docker compose --profile foss up
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: pocketcoder-ntfy
    profiles:
      - foss
    command: serve
    environment:
      - TZ=UTC
      - NTFY_BASE_URL=${PN_URL} # Should be your domain or local IP
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all # Sovereign Privacy: Default to private
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-auth:/var/lib/ntfy
    # ports:
    #   - "2586:80"
    networks:
      - pocketcoder-pocketbase-sdk
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 🔗 TAILSCALE (Remote Access Tunnel)
  # To enable: docker compose --profile tailscale up
  # Modes: TAILSCALE_MODE=funnel (default, public URL) or TAILSCALE_MODE=private (Tailnet only)
  tailscale:
    image: tailscale/tailscale:latest
    container_name: pocketcoder-tailscale
    profiles:
      - tailscale
    hostname: ${TS_HOSTNAME:-pocketcoder}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-pocketcoder}
      - TAILSCALE_MODE=${TAILSCALE_MODE:-funnel}
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./deploy/tailscale/entrypoint.sh:/entrypoint.sh:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - pocketcoder-tailscale
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status", "--json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 🔒 CADDY (Automatic HTTPS Reverse Proxy)
  # To enable: docker compose --profile caddy up -d
  # Uses sslip.io for automatic SSL without a domain name.
  # Set CADDY_DOMAIN in .env (e.g. 194-163-45-3.sslip.io)
  caddy:
    image: caddy:2-alpine
    container_name: pocketcoder-caddy
    profiles:
      - caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - pocketcoder-dashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pb_data:
  # pb_backups:
  #   external: true
  #   name: pocketcoder_pb_backups
  pocketcoder-logs:
  goose_workspace:
  llm_keys:  # Shared LLM API keys (env file written by PocketBase, read by sandbox)
  ntfy-cache:
  ntfy-auth:
  tailscale_state:  # Persists Tailscale node identity across restarts
  caddy_data:       # Persists TLS certificates
  caddy_config:
  goose_data:        # Goose SQLite/session state; back up independently of PocketBase
  goose_config:      # Goose config.yaml + keys.env, written by PocketBase, read by goose
  cognee_data:        # cognee's embedded SQLite/LanceDB/Kuzu storage
  cognee_config:       # cognee.env, written by PocketBase, read by cognee

networks:
  pocketcoder-dashboard:
    driver: bridge
  pocketcoder-docker:
    driver: bridge
  pocketcoder-tools:
    driver: bridge
  pocketcoder-pocketbase-sdk:
    driver: bridge
  pocketcoder-tailscale:
    driver: bridge
  # Private ACP network shared only by PocketBase (c1) and Goose (c2). Goose is
  # reached over an authenticated WebSocket; it publishes no host port and joins
  # no other PocketBase network, so this is its sole path to/from c1.
  pocketcoder-agent:
    driver: bridge
  # Gives Goose model-provider egress without a route to PocketBase services.
  pocketcoder-goose-egress:
    driver: bridge
  # Carries MCP traffic between Goose and the Docker MCP Gateway only -
  # deliberately separate from pocketcoder-agent (Goose's sole path to/from
  # PocketBase) so this addition doesn't touch that boundary.
  pocketcoder-mcp-gateway:
    driver: bridge
  # Carries MCP traffic between Goose and cognee only - deliberately separate
  # from pocketcoder-agent (Goose's sole path to/from PocketBase) so this
  # addition doesn't touch that boundary. Mirrors pocketcoder-mcp-gateway.
  pocketcoder-cognee:
    driver: bridge
