services:
  # 🏰 POCKETBASE CORE (Backend Only)
  pocketbase:
    build:
      context: .
      dockerfile: services/pocketbase/Dockerfile
    container_name: pocketcoder-pocketbase
    ports:
      - "8090:8090" # PocketBase UI
    volumes:
      - pb_data:/app/pb_data
      # - pb_backups:/app/pb_backups
      - pocketcoder-logs:/app/pb_public/logs
      - opencode_workspace:/workspace
      - ./services/mcp-gateway/config:/mcp_config
      - llm_keys:/llm_keys
    environment:
      - POCKETBASE_SUPERUSER_EMAIL=${POCKETBASE_SUPERUSER_EMAIL}
      - POCKETBASE_SUPERUSER_PASSWORD=${POCKETBASE_SUPERUSER_PASSWORD}
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD}
      - AGENT_EMAIL=${AGENT_EMAIL}
      - AGENT_PASSWORD=${AGENT_PASSWORD}
      - PN_PROVIDER=${PN_PROVIDER}
      - PN_URL=${PN_URL}
      - PN_RELAY_SECRET=${PN_RELAY_SECRET}
      - DOCKER_HOST=tcp://docker-socket-proxy-write:2375
      # Private c1 -> relay -> c2 path. Leave the secret unset unless the
      # `agent` profile is started; the PocketBase route then stays disabled.
      - GOOSE_ACP_URL=${GOOSE_ACP_URL:-http://goose-acp-relay:3000/acp}
      - GOOSE_SERVER__SECRET_KEY=${GOOSE_SERVER__SECRET_KEY:-}
      - GOOSE_WORKSPACE=${GOOSE_WORKSPACE:-/workspace}
      - SANDBOX_PROXY_URL=${SANDBOX_PROXY_URL:-http://sandbox:3001}
    command: ["/app/pocketbase", "serve", "--http=0.0.0.0:8090"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - pocketcoder-dashboard
      - pocketcoder-docker
      - pocketcoder-pocketbase-sdk
      - pocketcoder-tailscale
      - pocketcoder-agent-c1
      - pocketcoder-control

  # 🪿 GOOSE C2 (private agent core)
  # Starts only with `docker compose --profile agent up`. It never publishes a
  # host port and cannot share a Docker network with PocketBase.
  goose:
    build:
      context: services/goose
      dockerfile: Dockerfile
    container_name: pocketcoder-goose
    profiles: ["agent"]
    environment:
      - GOOSE_SERVER__SECRET_KEY=${GOOSE_SERVER__SECRET_KEY:-}
      - GOOSE_PROVIDER=${GOOSE_PROVIDER:-anthropic}
      - GOOSE_MODEL=${GOOSE_MODEL:-MiniMax-M2.5}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_HOST=${ANTHROPIC_HOST:-https://api.minimax.io/anthropic}
      - GOOSE_DISABLE_KEYRING=1
      - GOOSE_PATH_ROOT=/goose
      - GOOSE_TELEMETRY_ENABLED=false
    volumes:
      - goose_data:/goose
      - opencode_workspace:/workspace
    working_dir: /workspace
    networks:
      - pocketcoder-agent-c2
      - pocketcoder-goose-egress
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-way architectural relay: c1 can reach this service, which can reach
  # c2. Goose never joins a PocketBase network.
  goose-acp-relay:
    image: nginx:1.27.5-alpine
    container_name: pocketcoder-goose-acp-relay
    profiles: ["agent"]
    depends_on:
      goose:
        condition: service_healthy
    volumes:
      - ./services/goose/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pocketcoder-agent-c1
      - pocketcoder-agent-c2
    restart: unless-stopped

  # 🔨 SANDBOX (Isolated Execution Environment)
  sandbox:
    build:
      context: .
      dockerfile: services/sandbox/Dockerfile
    container_name: pocketcoder-sandbox
    init: true  # tini as PID 1 — handles zombie reaping + signal forwarding
    ports:
      - "2222:2222"  # SSH + SFTP (key-auth only)
    volumes:
      - opencode_workspace:/workspace
      - shell_bridge:/app/shell_bridge
      - llm_keys:/llm_keys:ro
    working_dir: /workspace
    environment:
      - TMUX_TMPDIR=/tmp/tmux
      - TMUX_SOCKET=/tmp/tmux/pocketcoder
      - MCP_HOST=http://mcp-gateway:8811/sse
      - DOCKER_MCP_IN_CONTAINER=1
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "curl -f http://localhost:3001/health && curl -f http://localhost:9888/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - pocketcoder-control
      - pocketcoder-tools


  # 🔌 MCP GATEWAY (MCP Server Gateway)
  mcp-gateway:
    build:
      context: .
      dockerfile: services/mcp-gateway/Dockerfile
    container_name: pocketcoder-mcp-gateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./services/mcp-gateway/config:/root/.docker/mcp
    environment:
      - DOCKER_MCP_IN_CONTAINER=1
      - LINODE_TOKEN=${LINODE_TOKEN}
      - ENABLE_TF_OPERATIONS=${ENABLE_TF_OPERATIONS}
      - TFE_TOKEN=${TFE_TOKEN}
      - DOCKER_MCP_TELEMETRY_DEBUG=0
    command: ["--port", "8811", "--transport", "sse", "--verbose", "--log-calls", "--log", "/var/log/mcp-gateway.log", "--catalog", "/root/.docker/mcp/docker-mcp.yaml", "--secrets", "/root/.docker/mcp/mcp.env", "--enable-all-servers"]
    networks:
      - pocketcoder-docker
      - pocketcoder-tools
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8811/health"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s

  # 🔒 DOCKER SOCKET PROXY - WRITE (Security Layer for PocketBase)
  # Currently shared by both PocketBase (restart) and Dozzle (logs)
  # For production: uncomment docker-socket-proxy-read below and update Dozzle config
  docker-socket-proxy-write:
    image: tecnativa/docker-socket-proxy:0.3
    container_name: pocketcoder-docker-proxy-write
    environment:
      # Enable container operations for PocketBase restart capability
      - CONTAINERS=1          # Allow container operations (list, inspect, restart)
      - POST=1                # Allow POST requests (for restart)
      - EVENTS=1              # Allow streaming events (for Dozzle)
      - INFO=1                # Required for Dozzle to detect Docker version
      - IMAGES=0              # Disable image operations
      - NETWORKS=0            # Disable network operations
      - VOLUMES=0             # Disable volume operations
      - BUILD=0               # Disable build operations
      - COMMIT=0              # Disable commit operations
      - CONFIGS=0             # Disable config operations
      - DISTRIBUTION=0        # Disable distribution operations
      - EXEC=0                # Disable exec operations
      - PLUGINS=0             # Disable plugin operations
      - SECRETS=0             # Disable secrets operations
      - SERVICES=0            # Disable services operations
      - SESSION=0             # Disable session operations
      - SWARM=0               # Disable swarm operations
      - SYSTEM=0              # Disable system operations
      - TASKS=0               # Disable tasks operations
      - LOG_LEVEL=info        # Logging level
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pocketcoder-docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 🛰️ SOVEREIGN INTERFACE (ACP Bridge)
  interface:
    build:
      context: services/interface
      dockerfile: Dockerfile
      args:
        POCO_AGENT: ${POCO_AGENT:-opencode}
    container_name: pocketcoder-interface
    restart: unless-stopped
    environment:
      POCKETBASE_URL: http://pocketbase:8090
      SANDBOX_PROXY_URL: http://sandbox:3001
      WORKSPACE_PATH: /workspace
      POCO_AGENT_CMD: ${POCO_AGENT_CMD:-opencode acp}
      AGENT_EMAIL: ${AGENT_EMAIL}
      AGENT_PASSWORD: ${AGENT_PASSWORD}
      HEALTH_PORT: "8080"
    volumes:
      - opencode_workspace:/workspace
      - llm_keys:/llm_keys:ro
    networks:
      - pocketcoder-pocketbase-sdk
      - pocketcoder-control
    depends_on:
      pocketbase:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  # 📈 SQLPAGE (SQLite Dashboard)
  sqlpage:
    image: lovasoa/sqlpage:v0.32.0
    user: root
    container_name: pocketcoder-sqlpage
    environment:
      - SQLPAGE_ENVIRONMENT=production
      - SQLPAGE_SITE_PREFIX=/api/pocketcoder/proxy/observability/
    volumes:
      - pb_data:/database/pocketbase           # PocketBase DB (operational)
      - ./services/sqlpage/dashboard:/var/www:ro                  # SQLPage queries/dashboards
      - ./services/sqlpage/config:/etc/sqlpage:ro       # Configuration (sqlpage.json, on_connect.sql)
    networks:
      - pocketcoder-dashboard
      - pocketcoder-tailscale
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      pocketbase:
        condition: service_healthy
      sandbox:
        condition: service_healthy


  # 📚 SURREALDB (Knowledge + Memory Database)
  # To enable: docker compose --profile knowledge up
  surrealdb:
    image: surrealdb/surrealdb:v2
    container_name: pocketcoder-surrealdb
    user: root
    profiles:
      - knowledge
    command: start --log info --user ${SURREAL_USER:-root} --pass ${SURREAL_PASSWORD:-root} rocksdb:/mydata/mydatabase.db
    volumes:
      - surrealdb_data:/mydata
    networks:
      - pocketcoder-knowledge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 📓 OPEN NOTEBOOK (Knowledge Base — NotebookLM Alternative)
  # To enable: docker compose --profile knowledge up
  open-notebook:
    image: lfnovo/open_notebook:v1-latest
    container_name: pocketcoder-open-notebook
    profiles:
      - knowledge
    depends_on:
      - surrealdb
    environment:
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASSWORD=root
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY}
    volumes:
      - notebook_data:/app/data
    # ports:
    #   - "8502:8502"  # OpenNotebook UI
    #   - "5055:5055"  # OpenNotebook REST API
    networks:
      - pocketcoder-knowledge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 🔗 OPEN NOTEBOOK MCP (MCP Bridge for OpenCode)
  # To enable: docker compose --profile knowledge up
  open-notebook-mcp:
    build:
      context: services/open-notebook-mcp
      dockerfile: Dockerfile
    container_name: pocketcoder-open-notebook-mcp
    profiles:
      - knowledge
    depends_on:
      - open-notebook
    environment:
      - OPEN_NOTEBOOK_URL=http://open-notebook:5055
      - MCP_TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=8000
    networks:
      - pocketcoder-knowledge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 🧠 POCO-MEMORY (Agent Memory MCP Server)
  # To enable: docker compose --profile knowledge up
  poco-memory:
    build:
      context: services/poco-memory
      dockerfile: Dockerfile
    container_name: pocketcoder-poco-memory
    profiles:
      - knowledge
    depends_on:
      - surrealdb
    environment:
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASSWORD=root
      - SURREAL_NAMESPACE=poco_memory
      - SURREAL_DATABASE=poco_memory
      - HOST=0.0.0.0
      - PORT=8001
    volumes:
      - fastembed_cache:/root/.cache/fastembed
    networks:
      - pocketcoder-knowledge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  # 🔔 NTFY (Optional Sovereign Notification Server)
  # To enable: docker compose --profile foss up
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: pocketcoder-ntfy
    profiles:
      - foss
    command: serve
    environment:
      - TZ=UTC
      - NTFY_BASE_URL=${PN_URL} # Should be your domain or local IP
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all # Sovereign Privacy: Default to private
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-auth:/var/lib/ntfy
    # ports:
    #   - "2586:80"
    networks:
      - pocketcoder-pocketbase-sdk
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 🔗 TAILSCALE (Remote Access Tunnel)
  # To enable: docker compose --profile tailscale up
  # Modes: TAILSCALE_MODE=funnel (default, public URL) or TAILSCALE_MODE=private (Tailnet only)
  tailscale:
    image: tailscale/tailscale:latest
    container_name: pocketcoder-tailscale
    profiles:
      - tailscale
    hostname: ${TS_HOSTNAME:-pocketcoder}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-pocketcoder}
      - TAILSCALE_MODE=${TAILSCALE_MODE:-funnel}
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./deploy/tailscale/entrypoint.sh:/entrypoint.sh:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - pocketcoder-tailscale
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status", "--json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 🔒 CADDY (Automatic HTTPS Reverse Proxy)
  # To enable: docker compose --profile caddy up -d
  # Uses sslip.io for automatic SSL without a domain name.
  # Set CADDY_DOMAIN in .env (e.g. 194-163-45-3.sslip.io)
  caddy:
    image: caddy:2-alpine
    container_name: pocketcoder-caddy
    profiles:
      - caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - pocketcoder-dashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pb_data:
  # pb_backups:
  #   external: true
  #   name: pocketcoder_pb_backups
  pocketcoder-logs:
  opencode_workspace:
  llm_keys:  # Shared LLM API keys (env file written by PocketBase, read by sandbox)
  shell_bridge:
  ntfy-cache:
  ntfy-auth:
  surrealdb_data:
  notebook_data:
  fastembed_cache:  # ONNX model cache for poco-memory embeddings
  tailscale_state:  # Persists Tailscale node identity across restarts
  caddy_data:       # Persists TLS certificates
  caddy_config:
  goose_data:        # Goose SQLite/session state; back up independently of PocketBase

networks:
  pocketcoder-dashboard:
    driver: bridge
  pocketcoder-control:
    driver: bridge
  pocketcoder-docker:
    driver: bridge
  pocketcoder-tools:
    driver: bridge
  pocketcoder-pocketbase-sdk:
    driver: bridge
  pocketcoder-knowledge:
    driver: bridge
  pocketcoder-tailscale:
    driver: bridge
  # c1 is PocketBase + the relay; c2 deliberately is not attached here.
  pocketcoder-agent-c1:
    driver: bridge
  # c2 contains Goose and the relay only. It carries private ACP traffic.
  pocketcoder-agent-c2:
    driver: bridge
  # Gives Goose model-provider egress without a route to PocketBase services.
  pocketcoder-goose-egress:
    driver: bridge
