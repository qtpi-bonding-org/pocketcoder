services:
  # POCO:BEGIN compose-pocketbase
  # 🏰 POCKETBASE CORE (Backend Only)
  pocketbase:
    image: pocketcoder-pocketbase:latest
    build:
      context: .
      dockerfile: server/pocketbase/Dockerfile
    container_name: pocketcoder-pocketbase
    ports:
      # Loopback-only: Caddy (host-level, see deploy/nixos/caddy.nix) proxies
      # this over TLS. Publishing on 0.0.0.0 would let anyone reach PocketBase
      # in plaintext on the public IP -- Docker's port-forwarding runs ahead
      # of/outside the host firewall's INPUT chain, so the firewall alone
      # can't block it.
      - "127.0.0.1:8090:8090" # PocketBase UI

    volumes:
      - pb_data:/app/pb_data
      # Keep database backups in a separate persistent volume so recreating
      # the PocketBase container does not destroy the recovery copy.
      - pb_backups:/app/pb_backups
      - pocketcoder-logs:/app/pb_public/logs
      - goose_workspace:/workspace
      - ./server/mcp-gateway/config:/mcp_config
      - llm_keys:/llm_keys
      - goose_config:/goose-config
      - cognee_config:/cognee-config
      - ${POCKETCODER_RELEASE_STATE_DIR:-./.runtime/release}:/var/lib/pocketcoder/release:ro
      - ${POCKETCODER_ARTIFACT_DIR:-./.runtime/artifacts}:/artifacts
      - ./deploy/release/harnesses.json:/etc/pocketcoder/harnesses.json:ro
    environment:
      - POCKETBASE_SUPERUSER_EMAIL=${POCKETBASE_SUPERUSER_EMAIL}
      - POCKETBASE_SUPERUSER_PASSWORD=${POCKETBASE_SUPERUSER_PASSWORD}
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD}
      - AGENT_EMAIL=${AGENT_EMAIL}
      - AGENT_PASSWORD=${AGENT_PASSWORD}
      - POCKETCODER_RELEASE=${POCKETCODER_RELEASE:-development}
      - POCKETCODER_RELEASE_POINTER=/var/lib/pocketcoder/release/current.json
      - POCKETCODER_ARTIFACT_DIR=/artifacts
      - POCKETCODER_HARNESS_CATALOG=/etc/pocketcoder/harnesses.json
      - PN_PROVIDER=${PN_PROVIDER}
      - PN_URL=${PN_URL}
      - PN_RELAY_SECRET=${PN_RELAY_SECRET}
      - DOCKER_HOST=tcp://docker-socket-proxy-write:2375
      # Direct authenticated c1 -> c2 WebSocket (goose enforces the secret on
      # the /acp upgrade as of v1.39; c1 sends it as ?token=). Required --
      # goose refuses to serve without it, and the PocketBase agent route
      # stays disabled if it's unset.
      # Read by RegisterMcpGatewayExtension's one-time config/extensions/add
      # call to set the Authorization header Goose sends the gateway --
      # required as of docker-mcp v0.43+ (mandatory HTTP auth by default).
      - MCP_GATEWAY_AUTH_TOKEN=${MCP_GATEWAY_AUTH_TOKEN}
    command: ["/app/pocketbase", "serve", "--http=0.0.0.0:8090"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - pocketcoder-dashboard
      - pocketcoder-docker
      - pocketcoder-pocketbase-sdk
      - pocketcoder-tailscale
      - pocketcoder-agent
      # Control-plane only: PocketBase proxies Ollama's model catalog and
      # downloads without gaining a route to Goose or peer harnesses.
      - pocketcoder-ollama-control
  # POCO:END compose-pocketbase

  # POCO:BEGIN compose-agent
  # 🪿 GOOSE C2 (private agent core)
  # Core service -- starts with plain `docker compose up`, same as
  # PocketBase and mcp-gateway. It never publishes a host port; it shares
  # only the private `pocketcoder-agent` ACP network with
  # PocketBase (authenticated WS) plus its own model-provider egress network.
  # goose is the sole system of record for history; PocketBase never calls it
  # back, so this network carries only c1 -> c2 ACP traffic.
  goose:
    profiles: ["harness-images"]
    image: pocketcoder-goose:1.43.0
    build:
      context: server/goose
      dockerfile: Dockerfile
    container_name: pocketcoder-goose
    environment:
      - GOOSE_SERVER__SECRET_KEY=${GOOSE_SERVER__SECRET_KEY:-}
      - GOOSE_PROVIDER=${GOOSE_PROVIDER:-anthropic}
      - GOOSE_MODEL=${GOOSE_MODEL:-MiniMax-M2.5}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_HOST=${ANTHROPIC_HOST:-https://api.minimax.io/anthropic}
      # Harmless unless GOOSE_PROVIDER=ollama. Keeping the endpoint in Compose
      # makes the default Linux topology deterministic rather than depending on
      # a host port or Docker Desktop-specific DNS.
      - OLLAMA_HOST=http://ollama:11434
      - GOOSE_DISABLE_KEYRING=1
      - GOOSE_PATH_ROOT=/goose
      - GOOSE_TELEMETRY_ENABLED=false
    volumes:
      - goose_data:/goose
      # Goose derives its config dir from GOOSE_PATH_ROOT: /goose/config/config.yaml
      # (verified via `goose info`, spec §13.1). Mount the PocketBase-written
      # config volume there — nested inside goose_data — so Goose actually reads
      # the rendered config.yaml/keys.env. NOT ~/.config/goose (goose ignores it).
      - goose_config:/goose/config
      - goose_workspace:/workspace
    working_dir: /workspace
    networks:
      - pocketcoder-agent
      - pocketcoder-goose-egress
      - pocketcoder-mcp-gateway
      - pocketcoder-cognee
      - pocketcoder-model
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  # POCO:END compose-agent

  # POCO:BEGIN compose-local-model
  # 🧠 OLLAMA (optional local model runtime)
  #
  # This is a singleton runtime, not a dynamically provisioned harness. Its
  # model cache survives restarts in ollama_models; model pulls happen through
  # Ollama's live API, so PocketBase never restarts it after a download.
  # It publishes no host port. The model network is inference-only (Goose and
  # peer harnesses); the separate control network lets PocketBase list/pull
  # models without joining the Goose ACP boundary.
  ollama:
    profiles: ["local-models"]
    image: ollama/ollama@sha256:f040603c11a11f125660eaf848170780e43b68973fc270e26f168536031ac258
    container_name: pocketcoder-ollama
    environment:
      - OLLAMA_MODELS=/ollama-models
    volumes:
      - ollama_models:/ollama-models
    networks:
      - pocketcoder-model
      - pocketcoder-ollama-control
    restart: unless-stopped
    healthcheck:
      # `ollama list` talks to the local server and succeeds even before a
      # model is downloaded, which is exactly the desired ready condition.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  # POCO:END compose-local-model

  # POCO:BEGIN compose-harness-images
  # Build-only images for dynamically provisioned peer harnesses. These
  # services never run under the normal stack: the inactive profile keeps
  # them out of `docker compose up`, while bootstrap/CI build and cache the
  # images so PocketBase can create a container on first harness selection.
  claude-code-harness-image:
    profiles: ["harness-images"]
    image: pocketcoder-harness-claude-code:0.64.2
    build:
      context: .
      dockerfile: server/harness-adapter/Dockerfile
      args:
        ACP_AGENT_PACKAGE: "@agentclientprotocol/claude-agent-acp@0.64.2"
        AGENT_CLI_PACKAGE: "@anthropic-ai/claude-code@2.1.221"

  codex-harness-image:
    profiles: ["harness-images"]
    image: pocketcoder-harness-codex:1.1.9
    build:
      context: .
      dockerfile: server/harness-adapter/Dockerfile
      args:
        ACP_AGENT_PACKAGE: "@agentclientprotocol/codex-acp@1.1.9"
        AGENT_CLI_PACKAGE: "@openai/codex@0.146.0"

  opencode-harness-image:
    profiles: ["harness-images"]
    image: pocketcoder-harness-opencode:1.18.11
    build:
      context: .
      dockerfile: server/harness-adapter/Dockerfile
      args:
        ACP_AGENT_PACKAGE: "opencode-ai@1.18.11"
  # POCO:END compose-harness-images

  # POCO:BEGIN compose-mcp-sandbox
  # 🔒 DOCKER SOCKET PROXY - MCP (Security Layer for MCP Gateway)
  # Separate from docker-socket-proxy-write on purpose: the gateway spawns
  # arbitrary third-party catalog images and creates/attaches an isolation
  # network per spawned MCP server container, which needs NETWORKS=1 --
  # PocketBase's own proxy deliberately keeps NETWORKS=0 since it only ever
  # restarts/inspects containers it already trusts. Sharing one proxy would
  # mean widening PocketBase's scope just to satisfy the gateway's, coupling
  # two different trust domains together.
  docker-socket-proxy-mcp:
    image: tecnativa/docker-socket-proxy@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    container_name: pocketcoder-docker-proxy-mcp
    environment:
      - CONTAINERS=1        # Spawn/inspect/stop MCP server containers
      - POST=1              # Allow POST requests (container/network create)
      - IMAGES=1            # Pull catalog images
      - NETWORKS=1          # Create/attach the per-session isolation network
      - EVENTS=1            # Streaming events
      - INFO=1              # Docker version info
      - VOLUMES=0           # Disable volume operations
      - BUILD=0             # Disable build operations
      - COMMIT=0            # Disable commit operations
      - CONFIGS=0           # Disable config operations
      - DISTRIBUTION=0      # Disable distribution operations
      - EXEC=0              # Disable exec operations
      - PLUGINS=0           # Disable plugin operations
      - SECRETS=0           # Disable secrets operations
      - SERVICES=0          # Disable services operations
      - SESSION=0           # Disable session operations
      - SWARM=0             # Disable swarm operations
      - SYSTEM=0            # Disable system operations
      - TASKS=0             # Disable tasks operations
      - LOG_LEVEL=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pocketcoder-docker-mcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 🔌 MCP GATEWAY (MCP Server Gateway)
  mcp-gateway:
    image: pocketcoder-mcp-gateway:latest
    build:
      context: .
      dockerfile: server/mcp-gateway/Dockerfile
    container_name: pocketcoder-mcp-gateway
    volumes:
      # docker-mcp v0.43+ requires --catalog/--enable-all-servers paths to
      # resolve under ~/.docker/mcp/catalogs/ -- an arbitrary bind-mounted
      # path (the pre-upgrade /root/.docker/mcp) is rejected outright. See
      # spikes/mcp-gateway-v0.43-upgrade/README.md.
      - ./server/mcp-gateway/config:/root/.docker/mcp/catalogs
    environment:
      - DOCKER_MCP_IN_CONTAINER=1
      - DOCKER_HOST=tcp://docker-socket-proxy-mcp:2375
      # Required as of docker-mcp v0.43+: HTTP/streaming transports refuse
      # unauthenticated requests by default (previously "Authentication
      # disabled (running in container)"). Every client that talks to this
      # gateway -- Goose's config/extensions/add headers, and each peer
      # harness's static MCP-attach config -- must send this same token.
      - MCP_GATEWAY_AUTH_TOKEN=${MCP_GATEWAY_AUTH_TOKEN}
      - LINODE_TOKEN=${LINODE_TOKEN}
      - ENABLE_TF_OPERATIONS=${ENABLE_TF_OPERATIONS}
      - TFE_TOKEN=${TFE_TOKEN}
      - DOCKER_MCP_TELEMETRY_DEBUG=0
    command: ["--port", "8811", "--transport", "streaming", "--verbose", "--log-calls", "--log", "/var/log/mcp-gateway.log", "--catalog", "docker-mcp.yaml", "--secrets", "/root/.docker/mcp/catalogs/mcp.env", "--enable-all-servers"]
    networks:
      - pocketcoder-docker-mcp
      - pocketcoder-tools
      - pocketcoder-mcp-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8811/health"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s
    depends_on:
      docker-socket-proxy-mcp:
        condition: service_healthy
  # POCO:END compose-mcp-sandbox

  # POCO:BEGIN compose-memory
  # 🧠 COGNEE (Agent Memory MCP Server)
  # Standalone MCP memory server for Goose — knowledge-graph + vector recall,
  # embedded storage (SQLite + LanceDB), no external DB services. Registered
  # as a live Goose extension by hooks.RegisterCogneeExtension (Task 6), not
  # via the mcp_servers/Docker-MCP-gateway catalog path.
  # Optional, unlike goose/mcp-gateway: cognee/cognee-mcp:main is a multi-GB
  # pull (bundles ML/embedding deps), and RegisterCogneeExtension already
  # handles cognee being absent gracefully (bounded retries, then logs and
  # gives up -- goose keeps working without the memory extension).
  # To enable: docker compose --profile memory up
  # One-shot init: Docker creates the cognee_data named volume root-owned on
  # first use, but cognee-mcp's image runs as a non-root uid/gid 1000:1000 —
  # without this, cognee crashes on its first write with
  # `PermissionError: /cognee_data/system` (verified empirically, see
  # spikes/cognee-mcp-transport/). Runs once, exits 0, cognee waits for it.
  cognee-data-init:
    image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    container_name: pocketcoder-cognee-data-init
    profiles: ["memory"]
    command: ["chown", "-R", "1000:1000", "/cognee_data"]
    volumes:
      - cognee_data:/cognee_data

  cognee:
    image: cognee/cognee-mcp@sha256:513a4c6730b98287f1ee886376672392faa6644ba2149fc9100474b39332e8ba
    container_name: pocketcoder-cognee
    profiles: ["memory"]
    depends_on:
      cognee-data-init:
        condition: service_completed_successfully
    environment:
      # TRANSPORT_MODE/HTTP_PORT/MCP_ALLOWED_HOSTS are consumed by the image's
      # own entrypoint.sh, not passed as --transport CLI args — the entrypoint
      # appends its own --transport $TRANSPORT_MODE after any passed args, so
      # a CLI --transport would be silently overridden back to stdio.
      # MCP_ALLOWED_HOSTS must match the service's network alias:port, else
      # every cross-container request 421s on the DNS-rebinding Host check.
      - TRANSPORT_MODE=http
      - HTTP_PORT=8000
      - MCP_ALLOWED_HOSTS=cognee:8000
      # cognee's own defaults (pydantic BaseSettings env vars, case-insensitive)
      # write its SQLite/LanceDB/Kuzu state under a path baked into the image
      # (~/.cognee_system, ~/.data_storage) — NOT under /cognee_data. Without
      # these two, the cognee_data volume mount below is a no-op: nothing is
      # ever written there, state doesn't persist across container recreates,
      # and sqlpage's read-only mount (below, and in the sqlpage service) has
      # nothing to read. Verified empirically: spikes/cognee-mcp-transport.
      - DATA_ROOT_DIRECTORY=/cognee_data/data
      - SYSTEM_ROOT_DIRECTORY=/cognee_data/system
      # No LLM_API_KEY/embedding env vars required just to boot — those are
      # consumed lazily by remember/recall tool calls. Task 5's render hook
      # writes real values into cognee_config later; the placeholder is here
      # so the compose file is self-describing about the var's existence.
      - LLM_API_KEY=${COGNEE_LLM_API_KEY:-}
    volumes:
      - cognee_data:/cognee_data
      - cognee_config:/cognee-config
    networks:
      - pocketcoder-cognee
    restart: unless-stopped
    healthcheck:
      # No curl/wget in this image, and cognee-mcp exposes no plain /health
      # route (the streamable-HTTP MCP endpoint 406s on non-MCP requests,
      # which still proves the process is up and listening) — so just
      # confirm the port accepts a TCP connection.
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  # POCO:END compose-memory

  # POCO:BEGIN compose-pocketbase-docker-access
  # 🔒 DOCKER SOCKET PROXY - WRITE (Security Layer for PocketBase)
  # Currently shared by both PocketBase (restart) and Dozzle (logs)
  # For production: uncomment docker-socket-proxy-read below and update Dozzle config
  docker-socket-proxy-write:
    image: tecnativa/docker-socket-proxy@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    container_name: pocketcoder-docker-proxy-write
    environment:
      # Enable container operations for PocketBase restart capability
      - CONTAINERS=1          # Allow container operations (list, inspect, restart)
      - POST=1                # Allow POST requests (for restart)
      - EVENTS=1              # Allow streaming events (for Dozzle)
      - INFO=1                # Required for Dozzle to detect Docker version
      - IMAGES=1              # Allow image operations (for harness provisioning)
      - NETWORKS=0            # Disable network operations
      - VOLUMES=0             # Disable volume operations
      - BUILD=0               # Disable build operations
      - COMMIT=0              # Disable commit operations
      - CONFIGS=0             # Disable config operations
      - DISTRIBUTION=0        # Disable distribution operations
      - EXEC=0                # Disable exec operations
      - PLUGINS=0             # Disable plugin operations
      - SECRETS=0             # Disable secrets operations
      - SERVICES=0            # Disable services operations
      - SESSION=0             # Disable session operations
      - SWARM=0               # Disable swarm operations
      - SYSTEM=0              # Disable system operations
      - TASKS=0               # Disable tasks operations
      - LOG_LEVEL=info        # Logging level
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pocketcoder-docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  # POCO:END compose-pocketbase-docker-access

  # POCO:BEGIN compose-dashboard
  # 📈 SQLPAGE data init — on_connect.sql ATTACHes goose's and cognee's
  # SQLite files in `immutable=1` mode (see comment below), which refuses
  # to open a file that doesn't exist yet. goose only creates sessions.db
  # after it successfully starts (needs a configured provider key first),
  # and cognee is an entirely optional `--profile memory` service that may
  # never run at all -- on a fresh/default deployment, both files are
  # legitimately absent, which previously made sqlpage's connection pool
  # fail every single connection attempt ("pool timed out while waiting
  # for an open connection", verified via local repro). A zero-byte file
  # is a valid, empty SQLite database, so touching one into existence (only
  # if missing -- never overwrite real data) is enough for ATTACH to
  # succeed with zero rows rather than erroring out.
  sqlpage-data-init:
    image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    container_name: pocketcoder-sqlpage-data-init
    command:
      - sh
      - -c
      - |
        mkdir -p /goose_data/data/sessions /cognee_data/system/databases
        [ -f /goose_data/data/sessions/sessions.db ] || touch /goose_data/data/sessions/sessions.db
        [ -f /cognee_data/system/databases/cognee_db ] || touch /cognee_data/system/databases/cognee_db
    volumes:
      - goose_data:/goose_data
      - cognee_data:/cognee_data

  # 📈 SQLPAGE (SQLite Dashboard)
  sqlpage:
    image: lovasoa/sqlpage:v0.32.0
    user: root
    container_name: pocketcoder-sqlpage
    environment:
      - SQLPAGE_ENVIRONMENT=production
      - SQLPAGE_SITE_PREFIX=/api/pocketcoder/proxy/observability/
    volumes:
      - pb_data:/database/pocketbase           # PocketBase DB (operational)
      - ./server/sqlpage/dashboard:/var/www:ro                  # SQLPage queries/dashboards
      # Config actually lives under dashboard/config/ (sqlpage.json,
      # config/on_connect.sql) — ./server/sqlpage/config doesn't exist on
      # disk at all. This mismatch predates this branch (confirmed on main)
      # and silently no-ops both sqlpage.json's database_url (SQLPage falls
      # back to a throwaway in-memory DB every restart) and on_connect.sql's
      # ATTACH statements (opencode/cognee dashboards error "no such table").
      - ./server/sqlpage/dashboard/config:/etc/sqlpage:ro       # Configuration (sqlpage.json, on_connect.sql)
      # opencode was removed from this repo entirely (see git history) — its
      # on_connect.sql ATTACH referenced a volume/path that no longer exists
      # anywhere in this compose file, which hard-fails the whole SQLPage
      # connection pool the moment the real /etc/sqlpage config actually
      # loads (fixed above). Replaced with goose's own SQLite session store
      # instead (data/sessions/sessions.db under GOOSE_PATH_ROOT=/goose, per
      # spikes/goose-acp-http/README.md — WAL mode, safe for concurrent
      # read-only access).
      - goose_data:/goose_data:ro
      - cognee_data:/cognee_data:ro
    networks:
      - pocketcoder-dashboard
      - pocketcoder-tailscale
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      pocketbase:
        condition: service_healthy
      sqlpage-data-init:
        condition: service_completed_successfully
  # POCO:END compose-dashboard

  # POCO:BEGIN compose-notifications
  # 🔔 NTFY (Optional Sovereign Notification Server)
  # To enable: docker compose --profile foss up
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: pocketcoder-ntfy
    profiles:
      - foss
    command: serve
    environment:
      - TZ=UTC
      - NTFY_BASE_URL=${PN_URL} # Should be your domain or local IP
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all # Sovereign Privacy: Default to private
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-auth:/var/lib/ntfy
    # ports:
    #   - "2586:80"
    networks:
      - pocketcoder-pocketbase-sdk
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  # POCO:END compose-notifications

  # POCO:BEGIN compose-private-access
  # 🔗 TAILSCALE (Remote Access Tunnel)
  # To enable: docker compose --profile tailscale up
  # Modes: TAILSCALE_MODE=private (default, Tailnet only) or TAILSCALE_MODE=funnel (public URL)
  tailscale:
    image: tailscale/tailscale@sha256:cdf5612ded5be1344f1a704b8c5e53496db97376bb533e5e15f141e48bf60cc0
    container_name: pocketcoder-tailscale
    profiles:
      - tailscale
    hostname: ${TS_HOSTNAME:-pocketcoder}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-pocketcoder}
      - TAILSCALE_MODE=${TAILSCALE_MODE:-private}
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./deploy/tailscale/entrypoint.sh:/entrypoint.sh:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - pocketcoder-tailscale
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status", "--json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # POCO:END compose-private-access

  # POCO:BEGIN compose-local-caddy
  # 🔒 CADDY (Automatic HTTPS Reverse Proxy)
  # Optional Docker-based proxy for local/self-managed Docker deployments.
  # The supported standard Linux path uses native host Caddy instead; the
  # NixOS image also manages Caddy as a native systemd service.
  caddy:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: pocketcoder-caddy
    profiles:
      - caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - pocketcoder-dashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  # POCO:END compose-local-caddy

# POCO:BEGIN compose-persistent-volumes
volumes:
  pb_data:
  pb_backups:
  pocketcoder-logs:
  goose_workspace:
    name: pocketcoder_goose_workspace
  llm_keys:  # Shared LLM API keys (env file written by PocketBase, read by sandbox)
  ntfy-cache:
  ntfy-auth:
  tailscale_state:  # Persists Tailscale node identity across restarts
  caddy_data:       # Persists TLS certificates
  caddy_config:
  goose_data:        # Goose SQLite/session state; back up independently of PocketBase
  goose_config:      # Goose config.yaml + keys.env, written by PocketBase, read by goose
  cognee_data:        # cognee's embedded SQLite/LanceDB/Kuzu storage
  cognee_config:       # cognee.env, written by PocketBase, read by cognee
  ollama_models:       # downloaded local models; intentionally not in R2 cache
# POCO:END compose-persistent-volumes

# POCO:BEGIN compose-private-networks
networks:
  pocketcoder-dashboard:
    driver: bridge
  pocketcoder-docker:
    driver: bridge
  # Dedicated to mcp-gateway <-> its own scoped docker-socket-proxy -- kept
  # separate from pocketcoder-docker (PocketBase's proxy) so the two proxies'
  # permission sets never have to be reconciled onto one shared network.
  pocketcoder-docker-mcp:
    driver: bridge
  pocketcoder-tools:
    driver: bridge
  pocketcoder-pocketbase-sdk:
    driver: bridge
  pocketcoder-tailscale:
    driver: bridge
  # Private ACP network shared only by PocketBase (c1) and Goose (c2). Goose is
  # reached over an authenticated WebSocket; it publishes no host port and joins
  # no other PocketBase network, so this is its sole path to/from c1.
  pocketcoder-agent:
    driver: bridge
    name: pocketcoder-agent
  # Gives Goose model-provider egress without a route to PocketBase services.
  pocketcoder-goose-egress:
    driver: bridge
  # Carries MCP traffic between Goose and the Docker MCP Gateway only -
  # deliberately separate from pocketcoder-agent (Goose's sole path to/from
  # PocketBase) so this addition doesn't touch that boundary.
  pocketcoder-mcp-gateway:
    driver: bridge
  # Carries MCP traffic between Goose and cognee only - deliberately separate
  # from pocketcoder-agent (Goose's sole path to/from PocketBase) so this
  # addition doesn't touch that boundary. Mirrors pocketcoder-mcp-gateway.
  pocketcoder-cognee:
    driver: bridge
  # Local inference only: Goose and dynamic peer harnesses can reach Ollama,
  # but PocketBase cannot reach Goose through this network.
  pocketcoder-model:
    driver: bridge
    name: pocketcoder-model
  # Model-management control plane only: PocketBase proxies Ollama's catalog
  # and pull API without being joined to pocketcoder-model.
  pocketcoder-ollama-control:
    driver: bridge
    name: pocketcoder-ollama-control
# POCO:END compose-private-networks
